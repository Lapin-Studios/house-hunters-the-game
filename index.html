html, body { height: 100%; margin: 0; }

.btn {

  white-space: nowrap; user-select: none;

.btn-block { width: 100%; }
.input, .select, textarea.input {
  width: 100%; border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 11px; background: #fff;
  transition: border-color .15s;
}
.input:focus, .select:focus { border-color: var(--blue); outline: none; }
label.field { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
  border: 1.5px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
}
.chip.on, .seg button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg { display: inline-flex; background: #eef0f4; border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
.seg button:hover:not(.on) { background: rgba(255, 255, 255, .7); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.tag-new { background: var(--blue-l); color: var(--blue); }
.tag-cut { background: var(--green-l); color: var(--green); }
.tag-pending { background: var(--red); color: #fff; }
.tag-open { background: var(--gold-l); color: #8a5a00; }
.tag-newbuild { background: #ede7ff; color: var(--purple); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.hidden { display: none !important; }
kbd { font-family: var(--ui); background: #eef0f4; border: 1px solid #d4d7de; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: 12px; }

/* ---------- toasts ---------- */
#toasts { position: fixed; top: 14px; right: 14px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: min(380px, calc(100vw - 28px)); }
.toast { background: var(--navy); color: #fff; padding: 11px 15px; border-radius: 11px; box-shadow: var(--shadow-2); font-size: 14px; font-weight: 600; animation: toastIn .3s ease; pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; }
.toast.good { background: var(--green); }
.toast.bad { background: var(--red); }
.toast.gold { background: linear-gradient(135deg, #f4b63f, #e8873f); color: #2d1e00; }
.toast .t-icon { font-size: 18px; line-height: 1; }
.toast.out { animation: toastOut .3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }

/* ---------- modals ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(15, 20, 35, .55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 18px; animation: fadeIn .2s ease; backdrop-filter: blur(3px); }
@keyframes fadeIn { from { opacity: 0; } }
.modal { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow-3); width: min(560px, 100%); max-height: calc(100vh - 36px); display: flex; flex-direction: column; animation: popIn .25s cubic-bezier(.2, 1.3, .5, 1); }
.modal.wide { width: min(880px, 100%); }
.modal.xwide { width: min(1180px, 100%); height: calc(100vh - 36px); }
@keyframes popIn { from { opacity: 0; transform: scale(.94); } }
.modal-head { padding: 18px 22px 10px; display: flex; align-items: center; gap: 10px; }
.modal-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--navy); }
.modal-body { padding: 6px 22px 18px; overflow: auto; }
.modal-foot { padding: 14px 22px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); }
.modal-x { margin-left: auto; width: 34px; height: 34px; border-radius: 9px; border: 0; background: #f1f2f5; font-size: 18px; color: var(--ink-2); }
.modal-x:hover { background: #e6e8ee; }
.opt-group { margin: 14px 0; }
.opt-group .desc { font-size: 13px; color: var(--ink-3); margin-top: 6px; min-height: 18px; }

/* ==========================================================================
   Title screen
   ========================================================================== */
#screen-title { background: linear-gradient(180deg, #8ec9f0 0%, #cfe9f8 55%, #f8e7cf 100%); align-items: center; justify-content: flex-start; overflow-y: auto; }
.title-street { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; overflow: hidden; pointer-events: none; }

.title-sun { position: absolute; top: 60px; right: 12%; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #fff6c9 0%, #ffd66b 60%, rgba(255, 214, 107, 0) 72%); animation: sunPulse 6s ease-in-out infinite; }

.title-wrap { position: relative; z-index: 2; width: min(980px, 100%); padding: 34px 20px 270px; display: flex; flex-direction: column; align-items: center; }
.logo { text-align: center; }
.logo .logo-mark { display: inline-flex; align-items: center; justify-content: center; width: 86px; height: 86px; border-radius: 24px; background: var(--coral); box-shadow: 0 10px 0 var(--coral-d), var(--shadow-3); margin-bottom: 14px; animation: bob 3.5s ease-in-out infinite; }

.logo h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(42px, 7vw, 76px); line-height: .95; color: var(--navy); letter-spacing: -.5px; text-shadow: 0 3px 0 rgba(255, 255, 255, .7); }
.logo .sub { display: inline-block; margin-top: 10px; background: var(--navy); color: #fff; font-family: var(--display); font-weight: 600; letter-spacing: .3em; padding: 5px 16px 5px 20px; border-radius: 8px; font-size: 17px; transform: rotate(-2deg); }
.tagline { margin: 16px 0 22px; color: var(--navy-2); font-size: 17px; font-weight: 500; text-align: center; max-width: 560px; }
.title-grid { display: grid; grid-template-columns: 300px 1fr; gap: 18px; width: 100%; align-items: start; }
.agent-card { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow-2); padding: 16px; }

.rank-line { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13.5px; color: var(--ink-2); }
.rank-line b { color: var(--navy); }
.menu-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.menu-btn { display: flex; align-items: center; gap: 14px; text-align: left; padding: 16px 18px; border-radius: 16px; border: 0; background: var(--paper); box-shadow: var(--shadow-2); transition: transform .1s, box-shadow .15s; }
.menu-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-3); }
.menu-btn .mi { font-size: 30px; width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none; }

.menu-btn span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; }
.menu-btn.primary { background: var(--coral); grid-column: span 2; }
.menu-btn.primary b, .menu-btn.primary span { color: #fff; }
.menu-btn.primary span { opacity: .9; }

.menu-small { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.title-foot { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11.5px; color: rgba(29, 43, 79, .7); z-index: 3; pointer-events: none; }
.title-foot a { pointer-events: auto; color: inherit; }
.sound-toggle { position: fixed; top: 12px; right: 12px; z-index: 50; }

/* ==========================================================================
   Lobby
   ========================================================================== */
#screen-lobby { background: radial-gradient(1200px 600px at 20% 0%, #2c3e6b 0%, var(--navy) 60%); color: #fff; overflow-y: auto; }
.lobby-wrap { width: min(1100px, 100%); margin: 0 auto; padding: 24px 20px 30px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
.lobby-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.panel { background: var(--paper); color: var(--ink); border-radius: 18px; box-shadow: var(--shadow-2); padding: 16px 18px; }
.panel h3 { margin: 0 0 12px; font-family: var(--display); font-weight: 600; font-size: 19px; color: var(--navy); display: flex; align-items: center; gap: 8px; }

.player-row .pname { font-weight: 700; }
.player-row .badge { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: var(--gold-l); color: #8a5a00; text-transform: uppercase; }
.player-row .badge.you { background: var(--blue-l); color: var(--blue); }
.player-row.empty { background: transparent; border: 2px dashed var(--line); color: var(--ink-3); justify-content: center; font-size: 13.5px; }
.settings-grid { display: grid; gap: 14px; }
.settings-grid .opt label.field { margin-bottom: 6px; }
.lobby-actions { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.lobby-actions .note { color: rgba(255, 255, 255, .8); font-size: 14px; margin-right: auto; }

/* chat */
.chat { display: flex; flex-direction: column; min-height: 0; }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px 2px 8px; min-height: 120px; max-height: 260px; }
.chat-msg { font-size: 13.5px; line-height: 1.35; word-wrap: break-word; }

.chat-form .input { padding: 7px 10px; }

/* ==========================================================================
   Game HUD (shared top bar)
   ========================================================================== */
.hud { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: rgba(15, 22, 40, .92); color: #fff; z-index: 20; min-height: 52px; }
.hud .hud-logo { font-family: var(--display); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.hud .hud-round { font-size: 13px; opacity: .85; }
.hud .hud-pill { background: rgba(255, 255, 255, .1); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.timer { font-family: var(--display); font-weight: 600; font-size: 20px; padding: 3px 14px; border-radius: 10px; background: rgba(255, 255, 255, .12); min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
.timer.warn { background: var(--gold); color: #3b2a00; }
.timer.crit { background: var(--red); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.hud-players { display: flex; gap: 4px; }
.hud-player { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; background: #fff; border: 2.5px solid var(--c); position: relative; }
.hud-player svg { width: 30px; height: 35px; }
.hud-player.done::after { content: "✓"; position: absolute; inset: 0; background: rgba(47, 158, 91, .82); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.hud .btn { padding: 6px 11px; font-size: 13px; }
.hud .icon-btn { position: relative; }
.unread-dot { position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

/* ==========================================================================
   Meeting (office scene)
   ========================================================================== */
#screen-meeting { background: #3b3f52; }
.office { position: relative; flex: 1; overflow: hidden; display: flex; }
.office-scene { position: relative; flex: 1; min-width: 0; overflow: hidden; background: linear-gradient(180deg, #efe4d2 0%, #e7d8c0 62%, #b98a5d 62%, #a87a4f 100%); }
.office-window { position: absolute; top: 6%; left: 7%; width: 34%; height: 40%; border: 12px solid #fff; border-radius: 6px; box-shadow: inset 0 0 0 3px #d9cdb8, var(--shadow-2); overflow: hidden; background: linear-gradient(180deg, #8ec9f0, #dff1fb); }
.office-window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: #fff; }
.office-window svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 75%; }
.office-art { position: absolute; top: 9%; right: 9%; width: 16%; aspect-ratio: 4/3; background: #fff; border: 8px solid #6b4f36; box-shadow: var(--shadow-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.office-art svg { width: 100%; height: 100%; }

.office-clock { position: absolute; top: 8%; left: 47%; width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 5px solid #2b2b2b; box-shadow: var(--shadow-1); }
.office-clock::before, .office-clock::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; background: #2b2b2b; transform-origin: bottom center; border-radius: 2px; }
.office-clock::before { height: 22px; margin: -22px 0 0 -1.5px; animation: spin 60s linear infinite; }
.office-clock::after { height: 16px; margin: -16px 0 0 -1.5px; transform: rotate(120deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.clients-seat { position: absolute; left: 46%; bottom: 26.5%; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 4px; z-index: 2; }
.clients-seat .person { filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .15)); }
.clients-seat .pet { font-size: 54px; margin-left: -6px; align-self: flex-end; margin-bottom: 4px; animation: wag 1.2s ease-in-out infinite; transform-origin: bottom; }
.clients-seat .kid { font-size: 40px; align-self: flex-end; }
@keyframes wag { 50% { transform: rotate(-6deg); } }
.clients-enter { animation: walkIn 1.1s cubic-bezier(.2, .9, .3, 1); }
@keyframes walkIn { from { transform: translateX(60vw); } }
.talking .mouth { animation: talk .22s infinite alternate; transform-origin: 60px 75px; }
@keyframes talk { to { transform: scaleY(.4); } }
.person .eyes { animation: blink 5s infinite; transform-origin: 60px 54px; }
@keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
.desk { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: linear-gradient(180deg, #8a5a35 0%, #774b2b 14%, #6a4226 100%); box-shadow: 0 -6px 18px rgba(0, 0, 0, .25); z-index: 3; }
.desk::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: #9c6a42; }
.desk-items { position: absolute; left: 0; right: 0; bottom: 28%; height: 0; z-index: 4; }
.desk-monitor { position: absolute; right: 7%; bottom: -12px; width: 190px; height: 130px; background: #20242e; border-radius: 10px; border: 6px solid #2f3442; box-shadow: var(--shadow-2); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--display); font-weight: 600; cursor: pointer; transition: transform .15s; }
.desk-monitor:hover { transform: translateY(-3px); }
.desk-monitor::after { content: ""; position: absolute; bottom: -26px; left: 50%; width: 46px; height: 22px; margin-left: -23px; background: #2f3442; clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
.desk-monitor .scr { width: 100%; height: 100%; background: linear-gradient(135deg, #e85d3f, #f4a261); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 15px; }
.desk-mug { position: absolute; left: 9%; bottom: -8px; font-size: 44px; }
.desk-name { position: absolute; left: 24%; bottom: -34px; transform: translateX(-50%); background: linear-gradient(180deg, #3a3a3a, #1f1f1f); color: #f4d27a; padding: 6px 18px; border-radius: 4px; font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; box-shadow: var(--shadow-2); white-space: nowrap; }
.desk-papers { position: absolute; left: 30%; bottom: -16px; width: 120px; height: 18px; background: #fff; transform: rotate(-4deg); box-shadow: 0 2px 0 #ddd, 0 4px 0 #eee; }

.dialog { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); width: min(820px, 94%); z-index: 6; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow-3); padding: 16px 20px 14px; border: 3px solid var(--navy); }
.dialog .who { position: absolute; top: -16px; left: 18px; background: var(--navy); color: #fff; font-family: var(--display); font-weight: 600; padding: 3px 14px; border-radius: 9px; font-size: 15px; }
.dialog .text { font-size: 18px; line-height: 1.5; min-height: 54px; color: var(--ink); }
.dialog .text .caret { display: inline-block; width: 9px; height: 18px; background: var(--coral); margin-left: 2px; vertical-align: -3px; animation: caret .8s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.dialog .dlg-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.dialog .progress { font-size: 12.5px; color: var(--ink-3); }
.ask-panel { margin-top: 10px; }
.ask-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.ask-btn { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 11px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; transition: background .12s, border-color .12s; }
.ask-btn:hover:not(:disabled) { border-color: var(--coral); background: var(--coral-l); }

.ask-btn.asked { background: var(--teal-l); border-color: var(--teal); opacity: 1; }

.meeting-side { width: 340px; flex: none; background: var(--cream); border-left: 1px solid #e6d9c3; display: flex; flex-direction: column; min-height: 0; }
.meeting-side .side-head { padding: 12px 16px; border-bottom: 1px dashed #e0cfb1; font-family: var(--display); font-weight: 600; color: var(--navy); font-size: 18px; display: flex; align-items: center; gap: 8px; }
.meeting-side .side-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
.talk-log { display: flex; flex-direction: column; gap: 8px; }
.talk-line { background: #fff; border-radius: 12px 12px 12px 4px; padding: 8px 11px; font-size: 13.5px; box-shadow: var(--shadow-1); }
.talk-line.me { background: var(--navy); color: #fff; border-radius: 12px 12px 4px 12px; align-self: flex-end; max-width: 88%; }
.talk-line.reveal { border-left: 4px solid var(--teal); }

/* ---------- client brief (notepad) ---------- */
.brief { background: #fffdf3; border-radius: 12px; box-shadow: var(--shadow-1); padding: 14px 14px 12px; position: relative; background-image: repeating-linear-gradient(180deg, transparent 0 25px, #eef3fb 25px 26px); }
.brief::before { content: ""; position: absolute; left: 34px; top: 0; bottom: 0; width: 1.5px; background: #f5c2b6; }
.brief h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--navy); padding-left: 30px; }
.brief .bline { display: flex; gap: 8px; padding: 3px 0 3px 0; font-size: 13.5px; line-height: 1.4; align-items: flex-start; }
.brief .bline .bi { width: 24px; text-align: center; flex: none; font-size: 14px; }
.brief .bline .bt { flex: 1; }
.brief .bline.must .bt b { color: var(--red); }
.brief .bline.deal .bt b { color: var(--purple); }
.brief .bline.nice .bt b { color: var(--teal); }
.brief .learned { font-size: 10.5px; font-weight: 800; background: var(--teal-l); color: var(--teal); padding: 1px 6px; border-radius: 5px; margin-left: 4px; text-transform: uppercase; }
.brief .bsec { margin-top: 8px; padding-left: 32px; font-size: 11px; font-weight: 800; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }

/* ==========================================================================
   Showing day
   ========================================================================== */
#screen-showing { background: linear-gradient(180deg, #ffe9d6 0%, #fff6ec 100%); }

/* ==========================================================================
   Results / final
   ========================================================================== */
#screen-results, #screen-final { background: radial-gradient(1000px 600px at 50% -10%, #2c3e6b, var(--navy)); overflow-y: auto; }
.results-wrap { width: min(1150px, 100%); margin: 0 auto; padding: 22px 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.outcome { border-radius: 22px; padding: 22px 24px; display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; box-shadow: var(--shadow-3); background: #fff; position: relative; overflow: hidden; }

.earn { text-align: right; }

.earn .bonus { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.res-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.res-panel { background: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow-2); }
.res-panel h3 { margin: 0 0 10px; font-family: var(--display); font-weight: 600; color: var(--navy); font-size: 20px; display: flex; align-items: center; gap: 8px; }
.pick-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.pick-tab { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 7px 11px; display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
.pick-tab.on { border-color: var(--navy); background: #f3f5fa; }
.pick-tab .sc { width: 30px; height: 30px; font-size: 14px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--display); }
.pick-tab.chosen { border-color: var(--gold); background: #fffaf0; }
.lb { width: 100%; border-collapse: collapse; }
.lb th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); text-align: left; padding: 6px 6px; }
.lb td { padding: 8px 6px; border-top: 1px solid #f0f1f4; font-size: 14px; }
.lb tr.me td { background: #f5f8ff; }
.lb .pcell { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.lb .pcell .pav { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 2.5px solid var(--c); background: #fff; flex: none; }
.lb .pcell .pav svg { width: 30px; height: 35px; }
.lb .money { font-family: var(--display); font-weight: 600; color: var(--green); }
.best-match { display: flex; gap: 12px; align-items: center; }
.best-match .bm-thumb { width: 130px; aspect-ratio: 16/10; border-radius: 10px; overflow: hidden; flex: none; background: #dfeef8; cursor: pointer; }
.best-match .bm-thumb svg { width: 100%; height: 100%; }
.res-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.res-actions .note { color: rgba(255, 255, 255, .85); margin-right: auto; font-size: 14px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 20px 0 6px; }
.podium .pd { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; }
.podium .pd .pav { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; background: #fff; border: 4px solid var(--c); }
.podium .pd .pav svg { width: 76px; height: 89px; }
.podium .pd .block { width: 140px; border-radius: 12px 12px 0 0; background: rgba(255, 255, 255, .14); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; font-family: var(--display); font-weight: 600; font-size: 34px; }
.podium .pd .block small { font-size: 15px; font-family: var(--ui); font-weight: 700; color: var(--gold); }
.podium .pd.p1 .block { height: 150px; background: rgba(244, 182, 63, .35); }
.podium .pd.p2 .block { height: 110px; }
.podium .pd.p3 .block { height: 80px; }
.final-title { text-align: center; color: #fff; }
.final-title h1 { font-family: var(--display); font-weight: 700; font-size: 44px; margin: 0; }

/* career / achievements */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: #f6f8fb; border-radius: 12px; padding: 12px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--navy); }
.stat span { font-size: 12px; color: var(--ink-3); font-weight: 700; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-top: 10px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 12px; background: #f6f8fb; opacity: .55; filter: grayscale(1); }
.ach.got { opacity: 1; filter: none; background: var(--gold-l); }
.ach .ai { font-size: 26px; }
.ach b { display: block; font-size: 14px; }
.ach span { font-size: 12px; color: var(--ink-3); }
.rank-bar { height: 10px; background: #eef0f4; border-radius: 5px; overflow: hidden; margin: 6px 0 2px; }
.rank-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--coral), var(--gold)); }
.help h3 { font-family: var(--display); font-weight: 600; color: var(--navy); margin: 16px 0 6px; font-size: 18px; }
.help p, .help li { font-size: 14.5px; color: var(--ink-2); }
.help ol, .help ul { padding-left: 20px; margin: 6px 0; }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }

/* small screens */
@media (max-width: 1100px) {
  .side-col { width: 280px; }
  .filters { width: 230px; }
  .meeting-side { width: 290px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .title-grid { grid-template-columns: 1fr; }
  .lobby-wrap, .res-grid, .show-wrap, .detail-grid { grid-template-columns: 1fr; }
  .desktop { flex-direction: column; }
  .side-col { width: auto; }
  .filters { display: none; }
  .filters.open { display: block; position: absolute; z-index: 40; top: 0; bottom: 0; left: 0; width: 280px; box-shadow: var(--shadow-3); }
  .meeting-side { display: none; }
  .outcome { grid-template-columns: 1fr; text-align: center; }
  .outcome .o-thumb { margin: 0 auto; }
  .earn { text-align: center; }
  .menu-buttons { grid-template-columns: 1fr; }
  .menu-btn.primary { grid-column: auto; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
}
.only-narrow { display: none; }
@media (max-width: 900px) { .only-narrow { display: inline-flex; } }

/* ---------- coach marks (guided tips) ---------- */
.coach { position: fixed; z-index: 900; width: min(320px, calc(100vw - 20px)); background: var(--navy); color: #fff; border-radius: 14px; padding: 13px 15px 11px; box-shadow: var(--shadow-3); font-size: 14.5px; line-height: 1.45; animation: coachIn .25s ease; }
.coach-text b { color: #ffd166; }
.coach-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.coach-off { background: none; border: 0; color: rgba(255, 255, 255, .6); font-size: 12px; text-decoration: underline; padding: 0; cursor: pointer; }
.coach-off:hover { color: #fff; }
.coach-arrow { position: absolute; width: 14px; height: 14px; background: var(--navy); transform: translate(-50%, -50%) rotate(45deg); }
.coach[data-side="below"] .coach-arrow { top: 0; }
.coach[data-side="above"] .coach-arrow { top: 100% !important; }
.coach[data-side="left"] .coach-arrow { left: 100% !important; }
.coach[data-side="right"] .coach-arrow { left: 0 !important; }
.coach-ring { position: fixed; z-index: 899; pointer-events: none; border: 3px solid #ffd166; border-radius: 14px; box-shadow: 0 0 0 4px rgba(255, 209, 102, .3); animation: coachPulse 1.4s ease-in-out infinite; }
@keyframes coachIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes coachPulse { 50% { box-shadow: 0 0 0 9px rgba(255, 209, 102, .12); } }
.reduced-motion .coach, .reduced-motion .coach-ring { animation: none; }

/* ---------- HUD steps ---------- */
.hud-steps { display: flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.hud-steps .hs { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; color: rgba(255, 255, 255, .55); font-weight: 600; }
.hud-steps .hs b { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .12); font-size: 11.5px; }
.hud-steps .hs.on { background: rgba(255, 255, 255, .12); color: #fff; }
.hud-steps .hs.on b { background: var(--coral); color: #fff; }
.hud-steps .hs.done b { background: var(--green); color: #fff; }
.hud-steps .hs em { font-style: normal; background: var(--gold); color: #2d1e00; border-radius: 999px; padding: 1px 7px; font-size: 11.5px; font-weight: 800; }
.hud-steps .hs-sep { font-style: normal; opacity: .35; }
@media (max-width: 1180px) { .hud-steps .hs:not(.on) { display: none; } .hud-steps .hs-sep { display: none; } }
@media (max-width: 760px) { .hud-steps { display: none; } }

/* ---------- client hints ---------- */
.talk-line.hint { background: #fff8e1; border-left: 4px solid var(--gold); }
.talk-line.hint::after { content: "💡 Sounds like a hint: ask about it!"; display: block; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: #8a5a00; }
.dialog .hint-tag { display: inline-block; margin-left: 8px; background: var(--gold-l); color: #8a5a00; border: 1.5px solid var(--gold); border-radius: 999px; padding: 0 9px; font-size: 12.5px; font-weight: 700; vertical-align: 2px; animation: coachIn .3s ease; }
.ask-btn.suggest { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(244, 182, 63, .25); }

/* ---------- brief fit on listing cards ---------- */
.card .fit { margin-top: 8px; font-size: 12.5px; font-weight: 700; padding: 5px 9px; border-radius: 8px; display: flex; gap: 6px; align-items: center; }
.card .fit.ok { background: var(--green-l); color: #1d6b3d; }
.card .fit.no { background: var(--red-l); color: #9b2c2c; }
.card .fit.meh { background: var(--gold-l); color: #8a5a00; }
.card .fit .fit-nice { margin-left: auto; font-weight: 600; color: var(--teal); }
.fits-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--green-l); color: #1d6b3d; border-radius: 999px; padding: 5px 11px; cursor: pointer; user-select: none; }
.fits-toggle input { accent-color: var(--green); }
.brief-check { background: #eef9f6; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.brief-check .bc-head { font-size: 12px; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.brief-check .bc-verdict { font-weight: 800; margin: 2px 0 6px; font-size: 14.5px; }
.brief-check .bc-unknown { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }

/* ---------- welcome ---------- */
.welcome-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 6px 0 4px; }
.welcome-steps .ws { background: var(--cream); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 12px; text-align: center; }
.welcome-steps .ws .wi { font-size: 34px; line-height: 1; margin-bottom: 8px; }
.welcome-steps .ws b { display: block; font-family: var(--display); font-size: 17px; color: var(--navy); font-weight: 600; margin-bottom: 4px; }
.welcome-steps .ws span { font-size: 13px; color: var(--ink-2); line-height: 1.4; display: block; }
.welcome-steps .ws .wn { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 12px; font-weight: 800; align-items: center; justify-content: center; margin-bottom: 6px; }
@media (max-width: 760px) { .welcome-steps { grid-template-columns: 1fr 1fr; } }
.first-note { background: var(--teal-l); color: #1d6b5f; border-radius: 10px; padding: 8px 11px; font-size: 13.5px; font-weight: 600; }

/* compact question buttons so the client stays visible above the dialog */
.ask-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ask-btn { flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 10px 7px; font-size: 14px; }
.ask-btn .qh { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--navy); }
.ask-btn .qi { font-size: 16px; }
.ask-btn .qq { font-size: 12px; font-weight: 500; color: var(--ink-3); line-height: 1.3; }
@media (max-width: 900px) { .ask-grid { grid-template-columns: 1fr 1fr; } }
.dialog.asking { padding-top: 14px; padding-bottom: 12px; }
.dialog.asking .text { font-size: 16px; min-height: 0; }
.dialog.asking .dlg-foot { display: none; }
.dialog.asking .ask-panel { margin-top: 8px; }
.clients-seat { transition: bottom .45s ease; }
.office-scene.asking .clients-seat { bottom: 35%; }

/* ---------- daily client ---------- */
.share-box { background: #f4f5f9; border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; font: 13px/1.5 var(--ui); white-space: pre-wrap; margin: 0 0 10px; color: var(--ink); }
.daily-panel { border: 2px solid var(--gold); }
.new-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); margin-left: 6px; vertical-align: 2px; }

</style>
</head>
<body>
  <div id="app">
    <section id="screen-title" class="screen" aria-label="Title screen"></section>
    <section id="screen-lobby" class="screen" aria-label="Lobby"></section>
    <section id="screen-meeting" class="screen" aria-label="Client meeting"></section>
    <section id="screen-computer" class="screen" aria-label="Your computer"></section>
    <section id="screen-showing" class="screen" aria-label="Showing day"></section>
    <section id="screen-results" class="screen" aria-label="Results"></section>
    <section id="screen-final" class="screen" aria-label="Final standings"></section>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><div style="color:#fff;padding:40px;font-family:sans-serif">House Hunters - The Game needs JavaScript turned on.</div></noscript>

    if (kind === 2) {
      L.beds = L.sqft < 650 ? 0 : L.sqft < 950 ? 1 : L.sqft < 1350 ? 2 : r.chance(0.6) ? 2 : 3;
      L.baths = L.beds <= 1 ? (r.chance(0.2) ? 1.5 : 1) : r.chance(0.6) ? 2 : 2.5;
    } else {
      let beds = Math.round(L.sqft / 610) + (r.chance(0.25) ? 1 : 0) - (r.chance(0.2) ? 1 : 0);
      beds = HH.clamp(beds, L.sqft > 1000 ? 2 : 1, Math.min(7, Math.floor(L.sqft / 330)));
      L.beds = beds;
      let baths = 1 + (L.sqft - 900) / 900 + (year >= 2000 ? 0.5 : 0) + (r.chance(0.3) ? 0.5 : 0);
      baths = Math.round(baths * 2) / 2;
      if (beds >= 3) baths = Math.max(baths, 1.5);
      if (kind === 1) baths = Math.max(baths, 2.5);
      L.baths = HH.clamp(baths, 1, Math.min(7, beds + 1.5));
    }

    // lot
    if (kind === 2) L.lotAcres = 0;
    else if (kind === 1) L.lotAcres = Math.round(r.range(0.02, 0.06) * 100) / 100;
    else {
      let lot = r.range(hood.lot[0], hood.lot[1]) * ((flags & 1) ? 1.12 : 1);
      lot = Math.max(lot, (area * 2.4) / 4047);
      L.lotAcres = Math.round(lot * 100) / 100;
    }

    // garage / parking
    if (kind === 2) {
      L.garage = r.chance(0.8) ? 1 : 0;
      L.garageType = L.garage ? (r.chance(0.7) ? "Garage parking (1 space)" : "Assigned surface spot") : "Street parking";
      if (L.garage && r.chance(0.15)) { L.garage = 2; L.garageType = "Garage parking (2 spaces)"; }
    } else if (kind === 1) {
      L.garage = r.chance(0.6) ? 2 : 1;
      L.garageType = `Attached ${L.garage}-car garage`;
    } else if (year < 1946) {
      const g = r.weighted([0, 1, 2], [0.45, 0.38, 0.17]);
      L.garage = g;
      L.garageType = g ? `Detached ${g}-car garage` : "Driveway / street parking";
    } else if (year < 1976) {
      const g = r.weighted([0, 1, 2], [0.2, 0.32, 0.48]);
      L.garage = g;
      L.garageType = g ? (city.id === "phoenix" && r.chance(0.45) ? `${g}-car carport` : `Attached ${g}-car garage`) : "Driveway parking";
    } else {
      const big = L.sqft > 3200;
      const g = r.weighted([1, 2, 3], [0.04, big ? 0.6 : 0.86, big ? 0.36 : 0.1]);
      L.garage = g;
      L.garageType = `Attached ${g}-car garage`;
    }
    L.carport = /carport/.test(L.garageType);

    // condition & renovation
    const age = 2026 - year;
    if (year >= 2019) L.condition = 3;
    else {
      const cheap = hood.ppsf < 260;
      const fixerP = cheap ? 0.15 : 0.05, tlcP = age > 30 ? 0.2 : 0.1;
      L.condition = r.weighted([0, 1, 2, 3], [fixerP, tlcP, 0.42, 0.33]);
    }
    L.renovated = 0;
    if (age > 22 && L.condition >= 2 && r.chance(0.6)) L.renovated = r.int(2012, 2025);
    if (L.renovated && L.condition === 2 && r.chance(0.5)) L.condition = 3;
    L.conditionLabel = ["Fixer-upper", "Needs TLC", "Good", "Move-in ready"][L.condition];

    // ---- features ----
    const lux = hood.ppsf >= 500;
    const F = {};
    const isHouse = kind === 0;
    F.pool = isHouse && r.chance(cl.pool * (lux ? 1.4 : 1) * (L.lotAcres > 0.25 ? 1.3 : 0.8));
    F.fenced = isHouse ? r.chance(0.6) : kind === 1 ? r.chance(0.3) : false;
    if (F.pool) F.fenced = true;
    F.office = r.chance(kind === 2 ? 0.14 : L.sqft > 2400 ? 0.6 : L.sqft > 1600 ? 0.38 : 0.15);
    F.fireplace = r.chance(kind === 2 ? 0.18 : cl.fireplace);
    F.ac = year >= 2005 ? true : r.chance(cl.ac);
    F.solar = isHouse && r.chance(cl.solar * (year >= 2015 ? 1.6 : 1));
    F.ev = r.chance(year >= 2015 ? 0.22 : kind === 2 ? 0.1 : 0.06);
    F.hardwood = r.chance(year < 1950 ? 0.85 : year >= 2010 ? 0.5 : 0.4);
    F.carpet = r.chance(F.hardwood ? 0.18 : (city.id === "phoenix" || city.id === "tampa") ? 0.35 : 0.6);
    F.kitchen = year >= 2010 || L.renovated >= 2012 || (L.condition === 3 && r.chance(0.5)) || r.chance(0.12);
    if (L.condition <= 1) F.kitchen = r.chance(0.08);
    F.primaryMain = L.stories === 1 || kind === 2 || r.chance(0.28);
    F.adu = isHouse && r.chance((["austin", "seattle", "denver", "nashville", "atlanta"].includes(city.id) ? 0.07 : 0.035) + (L.lotAcres > 0.2 ? 0.06 : 0));
    F.workshop = isHouse && r.chance(0.08 + (L.lotAcres > 0.3 ? 0.14 : 0) + (L.garage >= 2 && year < 1990 ? 0.04 : 0));
    F.deck = kind !== 2 ? r.chance(0.62) : r.chance(0.55); // condo: balcony
    F.porch = kind !== 2 && r.chance(cl.porch + (STYLE_ART[L.style] && STYLE_ART[L.style].porch ? 0.1 : 0));
    F.waterfront = waterM < 45;
    F.golf = golfM < 120;
    F.view = F.waterfront || (kind === 2 && L.unitFloor >= 6 && r.chance(0.65)) ||
      r.chance(({ queenanne: 0.45, arcadia: 0.35, ahwatukee: 0.3, highlands: 0.3, tarrytown: 0.12, westseattle: 0.25, ballard: 0.1, travisheights: 0.12 })[hood.id] || 0.03);
    F.smart = r.chance(year >= 2015 ? 0.45 : 0.1);
    F.garden = isHouse && L.lotAcres > 0.18 && r.chance(0.25);
    F.hotTub = r.chance(F.pool ? 0.32 : 0.05) && kind !== 2;
    F.rv = isHouse && L.lotAcres > 0.3 && r.chance(0.18);
    F.laundry = kind !== 2 || r.chance(0.75);
    if (kind === 2) {
      F.elevator = year > 1970 ? r.chance(0.92) : r.chance(0.35);
      F.gym = r.chance(year > 2000 ? 0.7 : 0.3);
      F.doorman = r.chance(hood.ppsf >= 550 ? 0.35 : 0.1);
      F.rooftop = r.chance(year > 2005 ? 0.45 : 0.12);
      F.bldgPool = r.chance(["phoenix", "tampa", "austin", "atlanta"].includes(city.id) ? 0.6 : 0.18);
    }
    L.f = F;
    L.viewLabel = F.waterfront ? "Waterfront" : kind === 2 ? (r.chance(0.5) ? "City skyline view" : cl.viewLabel) : cl.viewLabel;

    // ---- real location attributes (from OpenStreetMap) ----
    L.loc = {
      parkM: parkM, schoolM: schoolM, waterM: waterM, transitM: transitM, majorM: majorM,
      busy: !!(flags & 2), highway: !!(flags & 4), rail: !!(flags & 8), corner: !!(flags & 1),
      nearPark: parkM < 250, nearWater: waterM < 300, transit: transitM < 350,
    };
    L.loc.quiet = !L.loc.busy && !L.loc.highway && !L.loc.rail;
    const walk = 16 + 15.5 * Math.log2(1 + shops) + (transitM < 300 ? 7 : 0) + (parkM < 300 ? 3 : 0) + r.int(-4, 4);
    L.walk = Math.round(HH.clamp(walk, 4, 98));
    L.schoolRating = HH.clamp(r.int(hood.school[0], hood.school[1]) + (r.chance(0.1) ? -1 : 0), 1, 10);
    L.schoolName = SCHOOL_NAMES[HH.hash(hood.id + Math.floor(lat * 120) + Math.floor(lng * 120)) % SCHOOL_NAMES.length] + " Elementary";

    // flood
    let floodP = waterM < 80 ? 0.7 : waterM < 220 ? 0.3 : 0.02;
    if (city.id === "tampa") floodP += 0.15;
    L.flood = kind === 2 && L.unitFloor > 2 ? false : r.chance(Math.min(0.9, floodP));

    // HOA
    L.hoa = 0;
    L.hoaRules = [];
    if (kind === 2) L.hoa = Math.round(r.range(240, 520) * (hood.ppsf / 450) * (F.doorman ? 1.4 : 1) / 5) * 5;
    else if (kind === 1) L.hoa = Math.round(r.range(140, 320) / 5) * 5;
    else if (r.chance(hood.hoa)) L.hoa = Math.round((F.golf || lux ? r.range(120, 300) : r.range(30, 140)) / 5) * 5;
    if (L.hoa) {
      if (r.chance(0.45)) L.hoaRules.push("No short-term rentals");
      if (r.chance(0.15)) L.hoaRules.push("No rentals in the first 2 years");
      if (kind === 0 && r.chance(0.3)) L.hoaRules.push("No RVs or boats in driveway");
      if (r.chance(0.2)) L.hoaRules.push("Exterior changes need HOA approval");
    }
    L.noRentals = L.hoaRules.some((x) => /rentals/.test(x));
    // pet policy
    if (kind === 2) L.pets = r.weighted(["Pets allowed", "Cats & dogs under 25 lb", "Cats only", "No pets"], [0.5, 0.25, 0.1, 0.15]);
    else if (L.hoa && r.chance(0.12)) L.pets = "Max 2 pets";
    else L.pets = "Pets allowed";
    L.bigDogOK = L.pets === "Pets allowed" || L.pets === "Max 2 pets";
    L.dogOK = L.pets !== "Cats only" && L.pets !== "No pets";

    // possession / timeline
    const occ = r.weighted(["vacant", "owner", "tenant"], [0.3, 0.55, 0.15]);
    if (occ === "vacant") { L.closeDays = r.pick([14, 21]); L.possession = "Vacant — quick close possible"; }
    else if (occ === "owner") { L.closeDays = r.pick([30, 30, 45]); L.possession = `Owner-occupied — ${L.closeDays}-day close`; }
    else { L.closeDays = r.pick([60, 75, 90]); L.possession = `Tenant-occupied — lease ends in ${Math.round(L.closeDays / 30)} months`; }

    // disclosures
    const D = [];
    L.issues = { asIs: false, major: false };
    if (L.condition <= 1) {
      const pool = [
        `Roof is near the end of its life (installed ${year < 1995 ? r.int(1996, 2004) : year}).`,
        "Foundation settling noted; structural engineer's report available.",
        `Original ${Math.min(1980, Math.floor(year / 10) * 10)}s electrical panel may need replacement.`,
        `HVAC system is ${r.int(18, 27)} years old.`,
        "Galvanized plumbing in parts of the home.",
        `Termite damage repaired in ${r.int(2008, 2022)}.`,
      ];
      if (L.basement) pool.push(`Past water intrusion in the basement (last occurred ${r.int(2015, 2024)}).`);
      D.push(...r.sample(pool, L.condition === 0 ? 2 : 1));
      L.issues.major = true;
      if (L.condition === 0 && r.chance(0.65)) { D.push("Sold strictly AS-IS. Seller will make no repairs."); L.issues.asIs = true; }
    } else {
      if (r.chance(0.3)) D.push(r.pick([`New roof installed in ${r.int(2018, 2025)}.`, `HVAC replaced in ${r.int(2017, 2025)}.`, `Water heater replaced in ${r.int(2019, 2025)}.`, "Pre-listing inspection available — no major issues."]));
    }
    if (L.flood) D.push("Located in a FEMA flood zone (AE). Flood insurance required by lenders.");
    if (L.loc.rail) D.push("Freight/commuter rail line nearby.");
    if (L.hoaRules.length) D.push("HOA rules: " + L.hoaRules.join("; ") + ".");
    L.disclosures = D;

    // ---- price ----
    let ppsf = hood.ppsf * (kind === 1 ? 0.93 : 1);
    ppsf *= Math.pow(2000 / Math.max(500, L.sqft), kind === 2 ? 0.05 : 0.14);
    let m = 1;
    m *= [0.7, 0.86, 0.98, 1.05][L.condition];
    if (L.newBuild) m *= 1.1; else if (L.renovated >= 2016) m *= 1.04;
    if (kind === 0) {
      const mid = (hood.lot[0] + hood.lot[1]) / 2;
      m *= HH.clamp(1 + 0.18 * (L.lotAcres - mid) / mid, 0.86, 1.35);
    }
    if (F.pool) m *= 1.04;
    if (F.view) m *= 1.06;
    if (F.waterfront) m *= 1.22;
    if (F.golf) m *= 1.05;
    if (F.adu) m *= 1.07;
    if (F.solar) m *= 1.02;
    m *= 1 + (L.garage - 1.5) * 0.02;
    if (L.loc.busy) m *= 0.91;
    if (L.loc.highway) m *= 0.94;
    if (L.loc.rail) m *= 0.95;
    if (L.flood) m *= 0.97;
    m *= 1 + (L.schoolRating - 7) * 0.012;
    if (L.walk > 80) m *= 1.03;
    if (kind === 2) { m *= 1 + L.unitFloor * 0.004; if (F.doorman) m *= 1.05; }
    m *= r.range(0.94, 1.06);
    L.price = Math.max(60000, priceRound(r, L.sqft * ppsf * m));
    L.ppsf = Math.round(L.price / L.sqft);

    // ---- market status ----
    L.dom = r.weighted([0, 1, 2], [0.35, 0.4, 0.25]);
    L.dom = L.dom === 0 ? r.int(0, 6) : L.dom === 1 ? r.int(7, 30) : r.int(31, 140);
    L.history = [];
    const listedT = today - L.dom * DAY;
    L.origPrice = L.price;
    if (L.dom > 21 && r.chance(0.45)) {
      L.origPrice = priceRound(r, L.price * r.range(1.03, 1.09));
      L.history.push({ date: dateStr(listedT), event: "Listed for sale", price: L.origPrice });
      L.history.push({ date: dateStr(today - r.int(2, Math.max(3, L.dom - 10)) * DAY), event: "Price cut", price: L.price });
    } else {
      L.history.push({ date: dateStr(listedT), event: "Listed for sale", price: L.price });
    }
    if (r.chance(0.6)) {
      const soldYear = r.int(Math.max(year + 1, 1990), 2021);
      const back = Math.pow(1.045, 2026 - soldYear);
      L.history.push({ date: `${r.pick(["Mar", "Jun", "Aug", "Oct", "Apr", "Jul"])} ${r.int(1, 28)}, ${soldYear}`, event: "Sold", price: Math.round(L.price / back / r.range(1.0, 1.3) / 1000) * 1000 });
    }
    L.status = r.chance(0.07) ? "pending" : "active";
    if (L.status === "pending") L.history.push({ date: dateStr(today - r.int(0, Math.min(L.dom, 6)) * DAY), event: "Pending (under contract)", price: L.price });
    L.badges = [];
    if (L.status === "pending") L.badges.push("pending");
    if (L.dom <= 3) L.badges.push("new");
    if (L.origPrice > L.price) L.badges.push("pricecut");
    if (L.status === "active" && r.chance(0.15)) L.badges.push("openhouse");
    if (L.newBuild && kind === 0) L.badges.push("newbuild");

    // ---- costs ----
    L.taxAnnual = Math.round(L.price * city.tax / 100);
    L.insureAnnual = Math.round((L.price * 0.0034 * city.insure + (L.flood ? 1400 : 0)) / 10) * 10;
    if (kind === 2) L.insureAnnual = Math.round(L.insureAnnual * 0.35 / 10) * 10;
    L.pi = Math.round(HH.mortgage(L.price, HH.RATE, 30, HH.DOWN));
    L.monthly = Math.round(L.pi + L.taxAnnual / 12 + L.insureAnnual / 12 + L.hoa);

    // ---- address ----
    const street = hood.streets[si];
    L.street = street;
    const base = (HH.hash(hood.id + street) % 64 + 1) * 100;
    L.num = base + 2 * r.int(1, 48) + (r.chance(0.5) ? 1 : 0);
    if (kind === 2) L.unit = "#" + L.unitFloor + String(r.int(1, 12)).padStart(2, "0");
    L.address = `${L.num} ${street}${L.unit ? " " + L.unit : ""}`;
    L.mls = city.id.slice(0, 3).toUpperCase() + "-" + (1000000 + (HH.hash(L.id + today) % 8999999));

    // ---- extras (description-only details) ----
    const extraPool = EXTRAS.filter((x) => !(x.yard && (kind === 2 || L.lotAcres < 0.08)));
    L.extras = r.sample(extraPool, r.weighted([0, 1, 2, 3], [0.15, 0.4, 0.3, 0.15])).map((x) => x.key);

    // ---- listing agent ----
    L.agent = { name: r.pick(AGENT_FIRST) + " " + r.pick(AGENT_LAST), brokerage: r.pick(BROKERAGES) };

    // ---- art ----
    const sa = STYLE_ART[L.style] || STYLE_ART.Traditional;
    const pal = r.pick(PALETTES[sa.art] || PALETTES.Traditional);
    L.art = { style: L.style, palette: pal, roof: sa.roof, stories: L.stories, garage: kind === 0 ? Math.min(3, L.garage) : kind === 1 ? 1 : 0, garageDetached: /Detached|carport/.test(L.garageType), porch: F.porch || (sa.porch && r.chance(0.7)), chimney: F.fireplace, fence: F.fenced, pool: F.pool, solar: F.solar, trees: cl.trees, condition: L.condition, seed: r.seed(), floors: L.buildingFloors || 0, unitFloor: L.unitFloor || 0, wide: HH.clamp((L.sqft / L.stories) / 1800, 0.65, 1.35) };

    L.description = describe(L, city, hood, r);
    L.searchText = (L.address + " " + L.hoodName + " " + L.style + " " + L.typeLabel + " " + L.description + " " + L.disclosures.join(" ")).toLowerCase();
    return L;
  }

  function extraText(key) { const x = EXTRAS.find((e) => e.key === key); return x ? x.text : key; }
  HH.extraText = extraText;

  function describe(L, city, hood, r) {
    const F = L.f, s = [];
    const decade = Math.floor(L.yearBuilt / 10) * 10;
    const style = L.style.toLowerCase();
    const bedWord = L.beds === 0 ? "studio" : `${L.beds}-bedroom`;
    if (L.type === "condo") {
      s.push(r.pick([
        `Lock-and-leave living in this ${bedWord} condo on the ${HH.ordinal(L.unitFloor)} floor${F.view ? " with " + L.viewLabel.toLowerCase() + "s" : ""}.`,
        `Welcome to ${hood.name}! This bright ${bedWord} ${L.style === "Historic Loft" ? "historic loft" : "condo"} puts the whole neighborhood at your doorstep.`,
        `Sleek ${bedWord} residence on the ${HH.ordinal(L.unitFloor)} floor of a ${L.yearBuilt < 1945 ? "beautifully converted historic" : "well-run"} building.`,
      ]));
    } else if (L.condition === 0) {
      s.push(r.pick([
        `Calling all investors and DIYers! This ${decade}s ${style} has great bones and is priced to sell.`,
        `Bring your vision and your toolbox: a ${bedWord} ${style} in ${hood.name} ready for a full makeover.`,
        `Opportunity knocks! Needs a lot of love, but the location in ${hood.name} can't be beat.`,
      ]));
    } else if (L.condition === 1) {
      s.push(r.pick([
        `Charming ${decade}s ${style} that needs some TLC — make it your own!`,
        `Solid ${bedWord} ${style} with original character. Some updates needed.`,
      ]));
    } else if (L.newBuild) {
      s.push(`Brand-new ${style} by ${r.pick(BUILDERS)} — never lived in, with builder warranty.`);
    } else {
      s.push(r.pick([
        `Welcome home to this ${L.condition === 3 ? "beautifully updated" : "well-kept"} ${bedWord} ${style} in the heart of ${hood.name}.`,
        `Move right in to this ${r.pick(["light-filled", "inviting", "classic", "spacious", "stylish"])} ${style}${L.renovated ? ", thoughtfully renovated in " + L.renovated : ""}.`,
        `This ${L.yearBuilt < 1950 ? "character-filled" : "sharp"} ${style} checks all the boxes in ${hood.name}.`,
      ]));
    }
    if (F.kitchen) s.push(r.pick(["The updated kitchen features quartz counters and stainless appliances.", "Chef's kitchen with a big island, gas range, and plenty of storage.", "Renovated kitchen opens to the living area — perfect for entertaining."]));
    else if (L.condition >= 2) s.push(r.pick(["Original kitchen is clean and functional, ready for your personal touch.", "Kitchen is dated but well maintained."]));
    if (F.primaryMain && L.stories > 1) s.push("Primary suite is conveniently located on the main level.");
    if (F.office) s.push(r.pick(["A dedicated home office makes working from home easy.", "Bonus room works perfectly as a home office.", "Quiet den/office with French doors."]));
    if (L.basement === 2) s.push("Finished basement adds a rec room and extra living space.");
    else if (L.basement === 1) s.push("Unfinished basement offers storage and room to grow.");
    if (F.adu) s.push(r.pick(["Separate guest suite / ADU with its own entrance — great for in-laws or rental income.", "Detached casita (ADU) with kitchenette and bath: in-law suite or income potential!"]));
    if (L.type !== "condo") {
      const yard = [];
      if (F.fenced) yard.push("fully fenced backyard");
      if (F.pool) yard.push(city.id === "tampa" ? "screened pool" : "sparkling pool");
      if (F.hotTub) yard.push("hot tub");
      if (F.deck) yard.push(r.pick(["covered patio", "deck", "flagstone patio"]));
      if (F.porch) yard.push(city.id === "tampa" ? "screened lanai" : "screened porch");
      if (F.garden) yard.push("raised garden beds");
      if (yard.length) s.push(`Outside you'll find a ${HH.listJoin(yard)}${L.lotAcres >= 0.4 ? " on a generous " + L.lotAcres.toFixed(2) + "-acre lot" : ""}.`);
      else if (L.lotAcres < 0.1) s.push("Low-maintenance yard means more time for fun.");
    } else {
      const am = [];
      if (F.elevator) am.push("elevator");
      if (F.gym) am.push("fitness center");
      if (F.bldgPool) am.push("pool");
      if (F.rooftop) am.push("rooftop deck");
      if (F.doorman) am.push("24-hour concierge");
      if (am.length) s.push(`Building amenities include ${HH.listJoin(am)}.`);
      if (F.deck) s.push("Private balcony for morning coffee.");
    }
    if (F.workshop) s.push(r.pick(["Detached workshop with power — ideal for hobbies.", "Oversized garage with a workbench and workshop space."]));
    if (F.solar) s.push("Owned solar panels keep utility bills low.");
    if (F.ev) s.push("EV charger already installed in the garage.");
    if (F.rv) s.push("Side gate with RV/boat parking.");
    if (F.fireplace) s.push(r.pick(["Cozy up by the fireplace on cool nights.", "Wood-burning fireplace anchors the living room."]));
    if (F.hardwood) s.push(L.yearBuilt < 1950 ? "Original hardwood floors throughout." : "Hardwood floors in the main living areas.");
    if (F.view) s.push(`Enjoy the ${L.viewLabel.toLowerCase()}!`);
    if (L.extras.length) s.push(`Extras include ${HH.listJoin(L.extras.map(extraText).map((t) => (/^[aeiou]/.test(t) ? "an " : "a ") + t))}.`);
    if (L.loc.nearPark) s.push("Just steps from a neighborhood park.");
    if (L.walk >= 75) s.push("Walk to restaurants, coffee, and shops.");
    if (L.loc.transit && L.walk < 75) s.push("Transit stop around the corner.");
    if (L.loc.busy) s.push(r.pick(["Convenient location on a main road.", "Easy access to major thoroughfares."]));
    if (L.badges.includes("pricecut")) s.push("Motivated seller — just reduced!");
    if (L.closeDays <= 21) s.push("Vacant and ready for a quick close.");
    if (L.issues.asIs) s.push("Sold as-is.");
    return s.join(" ");
  }

  // ---------- public API ----------
  HH.getCity = function (cityId) {
    return HH_WORLD.cities.find((c) => c.id === cityId);
  };

  HH.generateMarket = function (cityId, seed, today) {
    const city = HH.getCity(cityId);
    if (!city) throw new Error("Unknown city " + cityId);
    today = today || Date.UTC(2026, 10, 17);
    const r = HH.rng(seed ^ 0x51ab1e);
    let total = 0;
    for (const h of city.hoods) total += h.homes.length;
    const target = 150;
    const listings = [];
    for (const hood of city.hoods) {
      const p = Math.min(1, (target / total) * (hood.condo ? 1.2 : 1));
      hood.homes.forEach((tuple, idx) => {
        const hr = HH.rng((seed ^ HH.hash(hood.id + ":" + idx)) >>> 0);
        if (hr.next() >= p) return;
        listings.push(genListing(city, hood, tuple, idx, hr, today));

    }
    // stable sort: newest first by default
    listings.sort((a, b) => a.dom - b.dom || (a.id < b.id ? -1 : 1));
    const byId = {};
    listings.forEach((l) => { byId[l.id] = l; });
    let checksum = 0;
    for (const l of listings) checksum = (checksum + l.price + l.beds * 7 + l.sqft * 3 + (l.f.pool ? 11 : 0)) % 1000000007;

    const work = city.work;
    listings.forEach((l) => { l.commute = work.map((w) => HH.driveMinutes(l.lat, l.lng, w.lat, w.lng)); });
    return { city, listings, byId, checksum, seed, today };
  };

  const COMPS = [
    { key: "monthly", topic: "budget" },
    { key: "quickClose", topic: "timeline" },
    { key: "noFlood", topic: "dealbreakers" },
    { key: "noHOA", topic: "dealbreakers" },
