  // ---------- builder context ----------
  function makeCtx(market, r, diff, arch, L, client) {
    const used = new Set();
    const x = {
      r, L, market, diff, arch, client, city: market.city,
      has: { cat: client.pets.some((p) => p.type === "cat"), dog: client.pets.some((p) => p.type === "dog") },
      petName: (client.pets[0] || {}).name, petName2: (client.pets[1] || {}).name,
      p1: client.people[0].name, p2: client.people[1] ? client.people[1].name : null,
      kid: client.kids[0] || "the baby", elder: client.elder || "Mom",
      p: (key, n, extra) => param(key, n, extra),
      extraNice: (keys) => {
        const k = r.pick(keys);
        return param("extra", k, "lifestyle");
      },
      add(kind, keyOrObj, o) {
        o = o || {};
        const base = typeof keyOrObj === "string" ? CAT[keyOrObj] : keyOrObj;
        if (!base) return false;
        const key = typeof keyOrObj === "string" ? keyOrObj : keyOrObj.key;
        if (used.has(key)) return false;
        const pass = base.test(L);
        if ((kind === "must" || kind === "deal") && !pass) return false;
        used.add(key);
        const req = Object.assign({}, base, { key, kind, w: o.w || (kind === "nice" ? 6 : 0) });
        ["say", "pro", "con", "hint", "label"].forEach((k) => { if (o[k] !== undefined) req[k] = o[k]; });
        req.topic = o.topic || base.topic || "lifestyle";
        req.hidden = !!o.hidden;
        req.origin = o.origin || "arch";
        client.reqs.push(req);
        return true;
      },
      nices(list, lo, hi, weights) {
        const n = r.int(lo, hi);
        const picks = r.shuffle(list.filter(Boolean)).slice(0, n + 2);
        let added = 0;
        for (const item of picks) {
          if (added >= n) break;
          const key = typeof item === "string" ? item : item.key;
          if (used.has(key)) continue;
          const base = typeof item === "string" ? CAT[item] : item;
          if (!base) continue;
          if (x.add("nice", item, { w: (weights && weights[key]) || r.int(5, 8), hidden: false })) added++;
        }
      },
      typeAll(line) { client.types = ["house", "townhome", "condo"]; client.typeLine = line; },
      baths(n) { if (L.baths >= n) client.minBaths = n; },
      core(o) {
        // bedrooms
        let beds = L.beds;
        if (r.chance(o.bedsDrop || 0) && beds > 1) beds -= 1;
        if (o.minBeds) beds = Math.max(beds, Math.min(o.minBeds, L.beds));
        client.minBeds = beds;
        client.minBaths = L.baths >= 2 && r.chance(0.35) ? 2 : L.baths >= 1.5 && r.chance(0.3) ? 1.5 : 1;
        // property type
        if (o.houseOnly || L.type === "house") client.types = o.houseOnly || r.chance(0.6) ? ["house"] : ["house", "townhome", "condo"];
        else client.types = L.type === "condo" ? ["condo", "townhome"] : ["townhome", "condo", "house"];
        if (client.types.length === 3) client.typeLine = r.pick(["We're open to a house, townhome or condo.", "Any type of home works — house, townhome, condo."]);
        // area mode
        const mode = r.weighted(["hoods", "commute", "any"], o.area || [0.6, 0.25, 0.15]);
        client.areaMode = mode;
        if (mode === "hoods") {
          const others = market.city.hoods.filter((h) => h.id !== L.hoodId);
          const anchorHood = market.city.hoods.find((h) => h.id === L.hoodId);
          const similar = others.filter((h) => Math.abs(h.ppsf - anchorHood.ppsf) / anchorHood.ppsf < 0.45);
          const extra = r.sample(similar.length ? similar : others, r.int(0, Math.min(2, (similar.length || others.length))));
          client.hoods = r.shuffle([L.hoodId].concat(extra.map((h) => h.id)));
        } else if (mode === "commute") {
          const wi = r.int(0, market.city.work.length - 1);
          const mins = L.commute[wi];
          client.commute = { idx: wi, max: Math.max(15, Math.ceil((mins + r.int(2, 8)) / 5) * 5) };
          client.commuteHidden = !!o.commuteHidden && x.diff !== "easy";
        }
      },
      comp(key, chance) {
        if (!r.chance(chance)) return false;
        return addComp(x, key, true);
      },
      used,
    };
    return x;
  }

  function addComp(x, key, hidden) {
    const { L, r } = x;
    const hid = x.diff === "easy" ? false : hidden;
    switch (key) {
      case "monthly": {
        const cap = Math.ceil((L.monthly * r.range(1.02, 1.07)) / 50) * 50;
        return x.add("must", param("monthly", cap), { topic: "budget", hidden: hid, origin: "comp", hint: "Honestly, it's the monthly payment that keeps me up at night." });
      }
      case "quickClose": return x.add("must", "quickClose", { hidden: hid, origin: "comp", say: "Our lease ends in three weeks! We need to close within 30 days — nothing tenant-occupied.", hint: "Our landlord is NOT happy with us right now..." });
      case "noFlood": return x.add("deal", "noFlood", { hidden: hid, origin: "comp", hint: "Our insurance agent gave us quite the lecture." });
      case "noHOA": return x.add("deal", "noHOA", { hidden: hid, origin: "comp", hint: "Our last HOA fined us for a purple front door. Long story." });
      case "quiet": return x.add("deal", "quiet", { hidden: hid, origin: "comp", say: "I'm an extremely light sleeper. It has to be quiet: no busy roads, highways or train tracks.", hint: "I haven't had a good night's sleep in years." });
      case "noCarpet": return x.add("must", "noCarpet", { hidden: hid, origin: "comp", say: "I have terrible dust allergies — no carpet, anywhere.", hint: "*sniffle* Sorry, allergies." });
      case "acSeattle": if (x.city.id !== "seattle" && x.city.id !== "denver") return false;
        return x.add("deal", "ac", { hidden: hid, origin: "comp", say: "After that brutal heat wave? It must have air conditioning.", hint: "I still have nightmares about last summer's heat wave." });
      case "hoaMax": if (!L.hoa) return false;
        return x.add("must", param("hoaMax", Math.ceil((L.hoa + r.int(20, 80)) / 25) * 25), { hidden: hid, origin: "comp", topic: "budget", hint: "We've heard horror stories about HOA fees." });
      case "partner": {
        if (!x.p2 || L.yearBuilt >= 1960 || !L.f.kitchen) return false;
        const a = x.add("must", param("older", 1960), { hidden: hid, origin: "comp", say: `${x.p1} wants an old house with character — built before 1960.`, hint: `${x.p1} and ${x.p2} have... different tastes. You'll see.` });
        const b = x.add("must", "kitchen", { hidden: hid, origin: "comp", topic: "style", say: `...but ${x.p2} refuses to live with an outdated kitchen. So: old house, new kitchen.` });
        return a || b;
      }
      case "extraMust": {
        const opts = L.extras.filter((k) => ["pantry", "mudroom", "clawfoot", "skylights", "gym", "musicroom", "firepit", "outdoorkitchen", "library", "craftroom", "theater", "sauna", "generator"].indexOf(k) >= 0);
        if (!opts.length) return false;
        const k = r.pick(opts);
        return x.add("must", param("extra", k), { hidden: hid, origin: "comp", say: `One quirky thing: we absolutely need a ${HH.extraText(k)}. It's... a whole thing.`, hint: "We have one very specific wish. Ask us about our style!" });
      }
    }
    return false;
  }

  // ---------- validity ----------
  function hardPass(client, L) {
    if (L.status !== "active") return false;
    if (L.price > client.budget.max) return false;
    if (L.beds < client.minBeds || L.baths < client.minBaths) return false;
    if (client.types.indexOf(L.type) < 0) return false;
    if (client.hoods && client.hoods.indexOf(L.hoodId) < 0) return false;
    if (client.commute && L.commute[client.commute.idx] > client.commute.max) return false;
    for (const q of client.reqs) if ((q.kind === "must" || q.kind === "deal") && !q.test(L)) return false;
    return true;
  }
  HH.hardPass = hardPass;

  // ---------- main generator ----------
  HH.generateClient = function (market, seed, diffKey) {
    const D = DIFF[diffKey] || DIFF.normal;
    const r = HH.rng((seed ^ 0xc11e47) >>> 0);
    const active = market.listings.filter((l) => l.status === "active");
    const sorted = active.slice().sort((a, b) => a.price - b.price || (a.id < b.id ? -1 : 1));
    const pct = (L) => sorted.indexOf(L) / Math.max(1, sorted.length - 1);

    let arch, anchor;
    for (let tries = 0; tries < 30 && !anchor; tries++) {
      const pool = ARCH.filter((a) => !a.needs || a.needs(market));
      arch = r.weighted(pool, pool.map((a) => a.w));
      const cands = active.filter((L) => arch.anchorOk(L) && pct(L) >= arch.band[0] - 0.03 && pct(L) <= arch.band[1] + 0.03);
      if (cands.length) anchor = r.pick(cands);
    }
    if (!anchor) { arch = ARCH[0]; anchor = r.pick(active); }

    // people
    const spec = arch.people(r);
    const last = r.pick(LAST);
    const people = [];
    const g1 = r.chance(0.5) ? "f" : "m";
    people.push(makePerson(r, g1, spec.age));
    if (spec.adults === 2) {
      const g2 = r.chance(0.8) ? (g1 === "f" ? "m" : "f") : g1;
      let p2 = makePerson(r, g2, spec.age + r.int(-3, 3));
      let guard = 0;
      while (p2.name === people[0].name && guard++ < 5) p2 = makePerson(r, g2, spec.age);
      people.push(p2);
    }
    const kids = [];
    for (let i = 0; i < (spec.kids || 0); i++) { let k = r.pick(KIDS); if (kids.indexOf(k) < 0) kids.push(k); }
    const pets = (spec.pets || []).map((t, i) => ({ type: t, name: t === "dog" ? DOGS[(r.int(0, DOGS.length - 1) + i) % DOGS.length] : r.pick(CATS) }));
    if (pets.length === 2 && pets[0].name === pets[1].name) pets[1].name = DOGS[(DOGS.indexOf(pets[0].name) + 3) % DOGS.length];

    const client = {
      seed, archId: arch.id, archTitle: arch.title, diff: diffKey,
      last, people, kids, pets, elder: spec.elder ? r.pick(SENIOR.f) : null,
      job: r.pick(arch.occupation),
      reqs: [], minBeds: 1, minBaths: 1, types: ["house", "townhome", "condo"], hoods: null, commute: null,
      handy: !!arch.handy, value: !!arch.value,
      anchorId: anchor.id,
    };
    client.name = people.length === 2 ? `${people[0].name} & ${people[1].name} ${last}` : `${people[0].name} ${last}`;
    client.shortName = people.length === 2 ? `the ${/(s|x|z|ch|sh)$/.test(last) ? last + "es" : last + "s"}` : people[0].name;
    client.likesWalk = arch.id === "urbanite" || arch.id === "remote";

    const x = makeCtx(market, r, diffKey, arch, anchor, client);
    arch.setup(x);

    // budget
    const head = r.range(D.head[0], D.head[1]);
    client.budget = { max: Math.max(HH.niceRound(anchor.price * head), Math.ceil(anchor.price / 5000) * 5000) };
    if (diffKey !== "easy" && r.chance(0.45)) client.budget.stretch = HH.niceRound(client.budget.max * r.range(1.03, 1.06));

    // complications
    let comps = D.comps === 0 ? 0 : D.comps === 1 ? r.weighted([0, 1], [0.35, 0.65]) : r.int(1, 2);
    const compOrder = r.shuffle(COMPS);
    for (const c of compOrder) {
      if (comps <= 0) break;
      if (addComp(x, c.key, true)) comps--;
    }

    // tighten until the puzzle is focused
    const valid = () => active.filter((L) => hardPass(client, L)).length;
    const tighteners = r.shuffle(["budget", "sqft", "office", "garage", "kitchen", "deck", "fenced", "nearPark", "quiet", "schools", "newer", "baths", "area", "moveIn", "noHOA", "walkable", "fireplace"]);
    let guard = 0;
    while (valid() > D.maxValid && guard < 24) {
      const t = tighteners[guard % tighteners.length];
      guard++;
      const hide = diffKey === "hard" && r.chance(0.35);
      switch (t) {
        case "budget": {
          const nm = HH.niceRound(anchor.price * r.range(1.0, 1.03));
          if (nm < client.budget.max && nm >= anchor.price) { client.budget.max = nm; if (client.budget.stretch) client.budget.stretch = HH.niceRound(nm * 1.04); }
          break;
        }
        case "sqft": {
          const n = Math.floor((anchor.sqft * r.range(0.86, 0.97)) / 100) * 100;
          if (n >= 800) x.add("must", param("sqft", n), { origin: "tight" });
          break;
        }
        case "baths": if (anchor.baths > client.minBaths) client.minBaths = Math.floor(anchor.baths * 2) / 2 >= 2 ? Math.min(anchor.baths, 2.5) : anchor.baths; break;
        case "schools": if (anchor.schoolRating >= 6) x.add("must", param("schools", anchor.schoolRating - (r.chance(0.5) ? 1 : 0)), { origin: "tight", hidden: hide, topic: "household" }); break;
        case "newer": if (anchor.yearBuilt >= 1990) x.add("must", "newerHome", { origin: "tight", hidden: hide }); break;
        case "area":
          if (client.hoods && client.hoods.length > 1) client.hoods = client.hoods.filter((h, i) => h === anchor.hoodId || i !== client.hoods.length - 1);
          else if (!client.hoods && !client.commute) { client.hoods = [anchor.hoodId]; client.areaMode = "hoods"; }
          break;
        case "garage": x.add("must", anchor.garage >= 2 ? "garage2" : "garage", { origin: "tight", hidden: hide }); break;
        default: x.add("must", t, { origin: "tight", hidden: hide }); break;
      }
    }
    // loosen if too strict for this difficulty
    guard = 0;
    while (valid() < D.minValid && guard < 10) {
      guard++;
      const idx = client.reqs.map((q) => q.origin).lastIndexOf("tight");
      const idx2 = idx >= 0 ? idx : client.reqs.map((q) => q.origin).lastIndexOf("comp");
      const archHard = client.reqs.map((q, i) => (q.origin === "arch" && q.kind !== "nice" ? i : -1)).filter((i) => i >= 0);
      if (idx2 >= 0) client.reqs.splice(idx2, 1);
      else if (diffKey === "easy" && archHard.length > 1) client.reqs.splice(archHard[archHard.length - 1], 1);
      else if (client.budget.max < anchor.price * 1.12) client.budget.max = HH.niceRound(client.budget.max * 1.04);
      else break;
    }

    // decide hidden requirements by difficulty
    const hard = client.reqs.filter((q) => q.kind !== "nice" || q.w >= 9);
    if (diffKey === "easy") client.reqs.forEach((q) => (q.hidden = false));
    else {
      let hiddenCount = client.reqs.filter((q) => q.hidden).length;
      const target = D.hidden + (diffKey === "hard" ? r.int(0, 1) : 0);
      // too many hidden -> unhide some (keep comps hidden first)
      const hiddenList = r.shuffle(client.reqs.filter((q) => q.hidden));
      while (hiddenCount > target && hiddenList.length) { hiddenList.pop().hidden = false; hiddenCount--; }
      // too few -> hide some more must/deal reqs
      const canHide = r.shuffle(hard.filter((q) => !q.hidden));
      while (hiddenCount < target && canHide.length) { canHide.pop().hidden = true; hiddenCount++; }
      // nice-to-haves: sometimes hidden behind lifestyle
      client.reqs.forEach((q) => { if (q.kind === "nice" && !q.hidden && r.chance(diffKey === "hard" ? 0.35 : 0.2)) q.hidden = true; });
    }
    if (client.commute && client.commuteHidden && diffKey !== "easy") client.commute.hidden = true;

    client.questions = D.questions;
    client.threshold = D.threshold;
    // make sure the anchor home is a clearly acceptable answer
    const boosters = r.shuffle(["deck", "fireplace", "kitchen", "nearPark", "garage", "hardwoodNice", "view", "porch", "basement", "office"]).filter((k) => CAT[k].test(anchor) && !x.used.has(k));
    let aev = HH.evaluate(client, anchor);
    while (aev.score < client.threshold + 5 && boosters.length) {
      x.add("nice", boosters.pop(), { w: r.int(5, 7), origin: "boost" });
      aev = HH.evaluate(client, anchor);
    }
    if (aev.score < client.threshold + 3) client.threshold = Math.max(45, aev.score - 3);
    client.validCount = valid();
    if (client.people.length === 1) client.reqs.forEach((q) => { ["say", "pro", "con", "hint"].forEach((k) => { if (q[k]) q[k] = HH.voice(client, q[k]); }); });
    buildDialogue(client, market, r, D, x);
    if (client.people.length === 1) {
      client.opening = client.opening.map((t) => HH.voice(client, t));
      client.hintLines = client.hintLines.map((t) => HH.voice(client, t));
      Object.keys(client.answers).forEach((k) => (client.answers[k] = client.answers[k].map((t) => HH.voice(client, t))));
    }
    return client;
  };

  // Single buyers speak in first person.
  HH.voice = function (c, t) {
    if (!t || !c || c.people.length !== 1) return t;
    const B = "\\b";
    const rules = [["our minds", "my mind"], ["our hearts", "my heart"], ["We're homebodies", "I'm a homebody"], ["We are", "I am"], ["we are", "I am"], ["We were", "I was"], ["we were", "I was"], ["We're", "I'm"], ["we're", "I'm"], ["We've", "I've"], ["we've", "I've"], ["We'd", "I'd"], ["we'd", "I'd"], ["We'll", "I'll"], ["we'll", "I'll"], ["We", "I"], ["we", "I"], ["Our", "My"], ["our", "my"], ["ours", "mine"], ["ourselves", "myself"], ["us", "me"]];
    let out = String(t);
    rules.forEach(([a, b]) => { out = out.replace(new RegExp(B + a + B, "g"), b); });
    return out;
  };

  // ---------- dialogue ----------
  function buildDialogue(c, market, r, D, x) {
    const city = market.city;
    const hoodName = (id) => city.hoods.find((h) => h.id === id).name;
    const lines = [];
    const arch = ARCH.find((a) => a.id === c.archId);
    const ctxNames = { p1: c.people[0].name, p2: c.people[1] && c.people[1].name, last: c.last, kidCount: ["zero", "one", "two", "three", "four"][c.kids.length] || c.kids.length, petName: c.pets[0] && c.pets[0].name, petName2: c.pets[1] && c.pets[1].name, job: c.job };
    lines.push(...arch.intro(ctxNames));
    // area
    if (c.hoods) {
      const names = c.hoods.map(hoodName);
      lines.push(names.length === 1 ? `We've got our hearts set on ${names[0]}. It has to be there.` : `We're looking in ${HH.listJoin(names, "or")} — nowhere else.`);
    } else if (c.commute && !c.commute.hidden) {
      lines.push(`Location-wise, anywhere in ${city.name} is fine, as long as the drive to ${city.work[c.commute.idx].name} is ${c.commute.max} minutes or less.`);
    } else {
      lines.push(`We're open to anywhere in ${city.name}.`);
    }
    // size & type
    const bedTxt = c.minBeds === 0 ? "a studio is fine" : `at least ${HH.plural(c.minBeds, "bedroom")}`;
    const typeTxt = c.types.length === 1 && c.types[0] === "house" ? " in a single-family house" : c.types.indexOf("house") < 0 ? ` — a ${HH.listJoin(c.types, "or")}` : "";
    lines.push(`We need ${bedTxt} and ${HH.baths(c.minBaths)}+ bath${c.minBaths === 1 ? "" : "s"}${typeTxt}.` + (c.typeLine ? " " + c.typeLine : ""));
    lines.push(r.pick([`Our budget tops out at ${HH.money(c.budget.max)}.`, `We're pre-approved for up to ${HH.money(c.budget.max)}.`, `The max we can spend is ${HH.money(c.budget.max)}.`]));
    // visible hard reqs
    const vis = c.reqs.filter((q) => !q.hidden && q.kind !== "nice");
    vis.forEach((q) => lines.push(q.say));
    const visNice = c.reqs.filter((q) => !q.hidden && q.kind === "nice");
    if (visNice.length) lines.push(`Nice-to-haves: ${HH.listJoin(visNice.map((q) => q.label.toLowerCase().replace(/ \(.*\)$/, "")))}. Not required, but they'd win us over.`);
    // hints for hidden
    const hiddenTopics = {};
    c.reqs.filter((q) => q.hidden).forEach((q) => { (hiddenTopics[q.topic] = hiddenTopics[q.topic] || []).push(q); });
    if (c.commute && c.commute.hidden) (hiddenTopics.work = hiddenTopics.work || []).push({ commute: true, hint: "I've been told traffic here is no joke." });
    const hintLines = [];
    Object.keys(hiddenTopics).forEach((t) => {
      const q = hiddenTopics[t].find((z) => z.hint);
      if (q && r.chance(D.hintP)) hintLines.push(q.hint);
    });
    lines.push(...hintLines);
    c.hintLines = hintLines.slice();
    lines.push(r.pick(["So... think you can find us a home?", "That's about it! Where do we start?", "No pressure, but we're counting on you!", "So, what do you think? Can you do it?"]));
    c.opening = lines.filter(Boolean);

    // topic answers
    c.answers = {};
    TOPICS.forEach((t) => {
      const hidden = c.reqs.filter((q) => q.hidden && q.topic === t.key);
      const out = hidden.map((q) => q.say);
      if (t.key === "work" && c.commute && c.commute.hidden) out.unshift(`I'm ${c.job} at ${city.work[c.commute.idx].name}, and I refuse to drive more than ${c.commute.max} minutes to get there.`);
      if (t.key === "budget" && c.budget.stretch) out.push(`If it's truly perfect, we could stretch to ${HH.money(c.budget.stretch)}... but we'd rather not.`);
      if (!out.length) out.push(flavor(t.key, c, city, r));
      c.answers[t.key] = out;
    });
  }

  function flavor(topic, c, city, r) {
    const pets = c.pets.length ? ` and ${HH.listJoin(c.pets.map((p) => p.name))} the ${c.pets[0].type}${c.pets.length > 1 ? "s" : ""}` : "";
    switch (topic) {
      case "household": return c.kids.length ? `It's us, the kids — ${HH.listJoin(c.kids)}${pets}. Nothing special to plan around beyond what I told you.` : `Just ${c.people.length === 2 ? "the two of us" : "me"}${pets}. Nothing special to worry about there.`;
      case "work": return `I'm ${c.job}. ${r.pick(["The commute isn't a big deal for me.", "I'm flexible on where we live, work-wise.", "Work won't really affect the search."])}`;
      case "lifestyle": return r.pick(["We're pretty low-key — Netflix, takeout, the occasional hike.", "We like brunch, farmers markets, and naps. Nothing that changes the house.", "Honestly? We're homebodies. What I told you covers it."]);
      case "dealbreakers": return r.pick(["If it checks the boxes I gave you, we're happy.", "Nothing beyond what I already said, I promise.", "Hmm... no, I think you've got everything."]);
      case "budget": return r.pick(["That number is firm. Our lender was very clear.", "Not a dollar more. Seriously.", "It's firm, sorry. We have a strict budget spreadsheet."]);
      case "timeline": return r.pick(["We're flexible — no rush at all.", "Whenever the right place comes along.", "Timing's not an issue for us."]);
      case "condition": return c.handy ? "Bring on the project!" : r.pick(["A little paint is fine; we're not too picky about cosmetics.", "We can live with some quirks."]);
      case "style": return r.pick(["We're not picky about style — it's what's inside that counts.", "Any style works if it feels like home.", "We'll know it when we see it!"]);
    }
    return "Nothing to add!";
  }

  // ---------- evaluation ----------
  HH.evaluate = function (c, L) {
    const out = { id: L.id, fails: [], pros: [], cons: [], checks: [] };
    let pts = 0;
    if (L.status !== "active") out.fails.push({ text: "It's already under contract! We can't even make an offer.", label: "Listing is available (not pending)" });
    // budget
    const b = c.budget;
    if (L.price > b.max) {
      if (b.stretch && L.price <= b.stretch) {
        pts -= 9;
        out.cons.push("It's over our budget... it would be a real stretch.");
        out.checks.push({ label: `Budget ≤ ${HH.money(b.max)}`, ok: "partial", note: "Within the stretch budget" });
      } else {
        out.fails.push({ text: `${HH.money(L.price)}? That's way over our ${HH.money(b.max)} budget!`, label: `Budget ≤ ${HH.money(b.max)}` });
        out.checks.push({ label: `Budget ≤ ${HH.money(b.max)}`, ok: false });
      }
    } else {
      out.checks.push({ label: `Budget ≤ ${HH.money(b.max)}`, ok: true });
      const ratio = L.price / b.max;
      if (ratio < (c.value ? 0.85 : 0.8)) { pts += c.value ? 10 : 7; out.pros.push(c.value ? "At this price, the numbers really work." : "And the price leaves us money for furniture!"); }
      else if (ratio < 0.9) pts += c.value ? 6 : 4;
    }
    // location
    if (c.hoods) {
      const ok = c.hoods.indexOf(L.hoodId) >= 0;
      out.checks.push({ label: "In a preferred neighborhood", ok });
      if (!ok) out.fails.push({ text: `${L.hoodName}? We told you we only want ${HH.listJoin(c.hoods.map((h) => HH.getCity(L.cityId).hoods.find((x) => x.id === h).name), "or")}.`, label: "Preferred neighborhood" });
    }
    if (c.commute) {
      const m = L.commute[c.commute.idx];
      const ok = m <= c.commute.max;
      out.checks.push({ label: `Commute ≤ ${c.commute.max} min`, ok, hidden: c.commute.hidden, topic: "work" });
      if (!ok) out.fails.push({ text: `The drive to work would be ${m} minutes. That's way too long.`, label: "Commute", hidden: c.commute.hidden });
      else if (m <= c.commute.max - 10) { pts += 3; out.pros.push("And my commute would be a breeze!"); }
    }
    // size & type
    const typeOk = c.types.indexOf(L.type) >= 0;
    out.checks.push({ label: "Property type: " + c.types.map((t) => ({ house: "house", townhome: "townhome", condo: "condo" }[t])).join("/"), ok: typeOk });
    if (!typeOk) out.fails.push({ text: `A ${L.type}? We wanted a ${HH.listJoin(c.types, "or")}.` });
    const bedOk = L.beds >= c.minBeds;
    out.checks.push({ label: `${c.minBeds}+ bedrooms`, ok: bedOk });
    if (!bedOk) out.fails.push({ text: `Only ${L.beds === 0 ? "a studio" : HH.plural(L.beds, "bedroom")}? We need ${c.minBeds}.` });
    else pts += Math.min(2, L.beds - c.minBeds) * 2;
    const bathOk = L.baths >= c.minBaths;
    out.checks.push({ label: `${HH.baths(c.minBaths)}+ baths`, ok: bathOk });
    if (!bathOk) out.fails.push({ text: `Only ${HH.baths(L.baths)} bath${L.baths === 1 ? "" : "s"}? Not enough.` });
    // requirements
    for (const q of c.reqs) {
      const ok = q.test(L);
      out.checks.push({ label: q.label, ok, kind: q.kind, hidden: q.hidden, topic: q.topic });
      if (q.kind === "must" || q.kind === "deal") {
        if (!ok) out.fails.push({ text: q.con || `It doesn't have: ${q.label}.`, label: q.label, hidden: q.hidden });
        else if (q.pro && q.kind === "must") out.pros.push(q.pro);
      } else if (q.kind === "nice") {
        if (ok) { pts += q.w; if (q.pro) out.pros.push(q.pro); }
        else if (q.w >= 9 && q.con) { out.cons.push(q.con); }
      }
    }
    // general tastes
    if (c.handy) { if (L.condition <= 1) pts += 4; }
    else {
      pts += [-10, -5, 0, 4][L.condition];
      if (L.condition <= 1) out.cons.push(L.condition === 0 ? "This place needs a LOT of work." : "It needs more work than we expected.");
      else if (L.condition === 3 && !out.pros.length) out.pros.push("Everything is so fresh and clean!");
    }
    if (L.loc.busy && !c.reqs.some((q) => q.key === "quiet" || q.key === "notBusy")) { pts -= 3; out.cons.push("The street is a little noisy."); }
    if (c.likesWalk) pts += (L.walk - 55) / 8;
    if (c.kids.length) pts += (L.schoolRating - 6) * 1.2;
    if (L.f.view && !c.reqs.some((q) => q.key === "view")) pts += 2;
    if (L.newBuild) pts += 2;
    if (L.dom > 90) { /* stale listing: no effect on buyer */ }
    const gut = (HH.hash(c.seed + ":" + L.id) % 9) - 4;
    let score = Math.round(HH.clamp(72 + pts + gut, 5, 99));
    if (out.fails.length) score = Math.max(4, Math.min(score, 46 - 7 * (out.fails.length - 1)));
    out.score = score;
    out.ok = out.fails.length === 0 && score >= c.threshold;
    return out;
  };

  HH.stars = function (score, accepted) {
    if (!accepted) return score >= 45 ? 1 : 0;
    return score >= 90 ? 5 : score >= 82 ? 4 : score >= 73 ? 3 : 2;
  };

  HH.reactionOpener = function (score) {
    if (score >= 90) return ["Oh. My. Gosh.", "Okay, I'm literally getting chills.", "THIS. This is the one I've been dreaming about."];
    if (score >= 78) return ["Ooh, I really like this.", "Now we're talking!", "This is really nice."];
    if (score >= 62) return ["Hmm, it's not bad.", "It's... nice. Let me think.", "There's a lot to like here."];
    if (score >= 45) return ["Hmm. I'm not sure about this one.", "It's okay, I guess.", "This one's a bit of a mixed bag."];
    return ["Oh... no.", "Um. Why are we here?", "I'm going to be honest with you..."];
  };

  // Client picks among presented houses: highest score that is acceptable. Tie -> earliest presented.
  HH.decide = function (c, presented) {
    let best = null;
    presented.forEach((p) => {
      if (!p.ev.ok) return;
      if (!best || p.ev.score > best.ev.score) best = p;
    });
    return best;
  };
})(window.HH);

</script>
  <script data-from="js/art/house.js">
// Procedural SVG "listing photo" for a home, built from its attributes.
(function (HH) {
  "use strict";
  HH.art = HH.art || {};
  let uid = 0;

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt < 0) { r = Math.round(r * (1 + amt)); g = Math.round(g * (1 + amt)); b = Math.round(b * (1 + amt)); }
    else { r = Math.round(r + (255 - r) * amt); g = Math.round(g + (255 - g) * amt); b = Math.round(b + (255 - b) * amt); }
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }
  HH.shade = shade;

  function tree(kind, x, y, s, r) {
    const k = kind;
    if (k === "palm") {
      const h = 70 * s;
      let out = `<path d="M${x} ${y} q ${4 * s} ${-h / 2} ${-2 * s} ${-h}" stroke="#8b6b4a" stroke-width="${5 * s}" fill="none" stroke-linecap="round"/>`;
      const tx = x - 2 * s, ty = y - h;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const ex = tx + Math.cos(a) * 26 * s, ey = ty + Math.sin(a) * 12 * s + 8 * s;
        out += `<path d="M${tx} ${ty} Q ${(tx + ex) / 2} ${ty - 10 * s} ${ex} ${ey}" stroke="#3f8f4f" stroke-width="${5 * s}" fill="none" stroke-linecap="round"/>`;
      }
      return out;
    }
    if (k === "desert") {
      if (r.chance(0.5)) {
        return `<g fill="#5f8f4e"><rect x="${x - 5 * s}" y="${y - 44 * s}" width="${10 * s}" height="${44 * s}" rx="${5 * s}"/><rect x="${x - 17 * s}" y="${y - 30 * s}" width="${7 * s}" height="${16 * s}" rx="${3.5 * s}"/><rect x="${x - 17 * s}" y="${y - 17 * s}" width="${14 * s}" height="${6 * s}" rx="3"/><rect x="${x + 9 * s}" y="${y - 36 * s}" width="${7 * s}" height="${18 * s}" rx="${3.5 * s}"/><rect x="${x + 3 * s}" y="${y - 22 * s}" width="${13 * s}" height="${6 * s}" rx="3"/></g>`;
      }
      return `<g><rect x="${x - 2 * s}" y="${y - 38 * s}" width="${4 * s}" height="${38 * s}" fill="#7a6248"/><ellipse cx="${x}" cy="${y - 44 * s}" rx="${22 * s}" ry="${12 * s}" fill="#9aaf6a"/><ellipse cx="${x + 6 * s}" cy="${y - 50 * s}" rx="${13 * s}" ry="${8 * s}" fill="#b0c47e"/></g>`;
    }
    if (k === "evergreen") {
      return `<g><rect x="${x - 3 * s}" y="${y - 14 * s}" width="${6 * s}" height="${14 * s}" fill="#6b4f36"/><polygon points="${x},${y - 92 * s} ${x - 22 * s},${y - 12 * s} ${x + 22 * s},${y - 12 * s}" fill="#2f6b45"/><polygon points="${x},${y - 92 * s} ${x - 14 * s},${y - 45 * s} ${x + 6 * s},${y - 45 * s}" fill="#3c8256"/></g>`;
    }
    const leaf = k === "oak" ? "#557a3a" : r.pick(["#5b9a4a", "#6aa84f", "#4f8a3f", "#7aa95c"]);
    return `<g><rect x="${x - 3.5 * s}" y="${y - 30 * s}" width="${7 * s}" height="${30 * s}" fill="#6b4f36"/><circle cx="${x}" cy="${y - 48 * s}" r="${24 * s}" fill="${leaf}"/><circle cx="${x - 14 * s}" cy="${y - 38 * s}" r="${15 * s}" fill="${shade(leaf, -0.12)}"/><circle cx="${x + 13 * s}" cy="${y - 40 * s}" r="${16 * s}" fill="${shade(leaf, 0.1)}"/></g>`;
  }

  function windowSvg(x, y, w, h, trim, opts) {
    opts = opts || {};
    let s = `<rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" fill="${trim}" rx="1"/>`;
    if (opts.boarded) {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#8a6a45"/><line x1="${x}" y1="${y + 3}" x2="${x + w}" y2="${y + h - 3}" stroke="#6b4f30" stroke-width="3"/><line x1="${x + w}" y1="${y + 3}" x2="${x}" y2="${y + h - 3}" stroke="#6b4f30" stroke-width="3"/>`;
      return s;
    }

  HH.art.house = function (L, opts) {

    s += `<pattern id="brick${id}" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="${body}"/><path d="M0 0H16M0 4H16M4 0V4M12 4V8" stroke="${shade(body, -0.25)}" stroke-width=".8"/></pattern>`;
    s += `<pattern id="siding${id}" width="10" height="7" patternUnits="userSpaceOnUse"><rect width="10" height="7" fill="${body}"/><path d="M0 6.5H10" stroke="${shade(body, -0.12)}" stroke-width=".9"/></pattern>`;
    s += `<pattern id="batten${id}" width="9" height="10" patternUnits="userSpaceOnUse"><rect width="9" height="10" fill="${body}"/><path d="M8.5 0V10" stroke="${shade(body, -0.1)}" stroke-width="1.2"/></pattern>`;
    s += `<pattern id="shingle${id}" width="12" height="7" patternUnits="userSpaceOnUse"><rect width="12" height="7" fill="${roofC}"/><path d="M0 6.5H12M6 0V3.5" stroke="${shade(roofC, -0.2)}" stroke-width=".8"/></pattern>`;
    s += `</defs>`;
    if (!opts.noSky) s += `<rect width="${W}" height="${H}" fill="url(#sky${id})"/>`;
    // clouds

    else if (seattle) s += `<path d="M260 ${G - 30} L320 ${G - 110} L380 ${G - 30}Z" fill="#dfe6ee" opacity=".8"/><path d="M300 ${G - 80} L320 ${G - 110} L338 ${G - 82}Z" fill="#fff"/>`;
    if (!opts.noSky) s += `<path d="M0 ${G - 30} Q 100 ${G - 52} 200 ${G - 34} T 400 ${G - 30} V${G} H0Z" fill="${desert ? "#d8bc95" : "#9cc28a"}" opacity=".7"/>`;
    // ground

    const tileRoof = /Spanish|Mediterranean|Southwest/.test(A.style);

    // back trees

    for (let i = 0; i < nt; i++) s += tree(climate, r.chance(0.5) ? r.int(20, x0 - 10) : r.int(x0 + totalW + 10, 385), G + 2, r.range(0.8, 1.15), r);

      if (x0 > 30) s += drawFence(4, x0 - 4);

    s += `<rect x="${x0}" y="${y0}" width="${bw}" height="${bh}" fill="none" stroke="${shade(body, -0.3)}" stroke-width="1"/>`;

        s += windowSvg(Math.round(wx - ww / 2), fy, ww, wh, trim, { gid: id, modern, shutters: shut, boarded: L.condition === 0 && isGround && i === 0, lit: opts.night && r.chance(0.6) });

    const dx = x0 + bw / 2 - 11, dy = G - 36;
    s += `<rect x="${dx - 3}" y="${dy - 3}" width="28" height="39" fill="${trim}"/><rect x="${dx}" y="${dy}" width="22" height="36" fill="${door}"/><circle cx="${dx + 17}" cy="${dy + 19}" r="1.6" fill="#e9c46a"/>`;

  function garageDoor(x, y, w, h, trim) {

  function sign(L, x, y) {

  }

  function condo(L, A, r, id, body, roofC, trim, door, G, W) {
    const floors = HH.clamp(A.floors || 6, 3, 14);
    const fh = Math.min(15, Math.floor(170 / floors));
    const bw = 170, x0 = 115, y0 = G - floors * fh - 10;
    let s = "";
    // neighbors
    s += `<rect x="20" y="${G - 110}" width="80" height="110" fill="${shade(body, -0.25)}" opacity=".7"/><rect x="300" y="${G - 140}" width="85" height="140" fill="${shade(body, -0.35)}" opacity=".7"/>`;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) s += `<rect x="${30 + j * 24}" y="${G - 100 + i * 16}" width="12" height="8" fill="#cfe1ee" opacity=".6"/>`;
    s += `<rect x="${x0}" y="${y0}" width="${bw}" height="${G - y0}" fill="${body}" stroke="${shade(body, -0.3)}"/>`;
    s += `<rect x="${x0 - 4}" y="${y0 - 6}" width="${bw + 8}" height="7" fill="${trim === "#9fb7c7" ? "#3a3f44" : roofC}"/>`;
    const targetF = HH.clamp(A.unitFloor, 1, floors);
    const cols = 6;
    for (let f = 0; f < floors; f++) {
      const fy = G - 10 - (f + 1) * fh + 2;
      for (let c = 0; c < cols; c++) {
        const wx = x0 + 10 + c * ((bw - 20) / cols);
        const mine = f + 1 === targetF && (c === 2 || c === 3);
        s += `<rect x="${wx}" y="${fy}" width="${(bw - 20) / cols - 6}" height="${fh - 5}" fill="${mine ? "#ffd166" : `url(#glass${id})`}" ${mine ? 'stroke="#ef8a17" stroke-width="1.5"' : ""}/>`;
      }
      if (f % 2 === 1 && fh >= 10) s += `<rect x="${x0 + 6}" y="${fy + fh - 4}" width="${bw - 12}" height="2" fill="${shade(body, -0.3)}"/>`;
    }
    const ty = G - 10 - targetF * fh + fh / 2;
    s += `<g><path d="M${x0 + bw + 6} ${ty} l12 -7 v14z" fill="#ef8a17"/><rect x="${x0 + bw + 18}" y="${ty - 9}" width="58" height="18" rx="4" fill="#ef8a17"/><text x="${x0 + bw + 47}" y="${ty + 4}" font-size="9" font-weight="700" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif">Unit ${HH.esc(L.unit || "")}</text></g>`;
    // lobby
    s += `<rect x="${x0 + bw / 2 - 22}" y="${G - 24}" width="44" height="24" fill="url(#glass${id})" stroke="${trim}"/><rect x="${x0 + bw / 2 - 30}" y="${G - 28}" width="60" height="5" fill="${door}"/>`;
    s += tree("deciduous", 100, G + 20, 0.7, r) + tree("deciduous", 300, G + 20, 0.75, r);

  }

  function townhome(L, A, r, id, pal, G) {
    let s = "";
    const units = 3, uw = 78, x0 = 200 - (units * uw) / 2;
    const h = A.stories * 42 + 8;
    for (let u = 0; u < units; u++) {
      const ux = x0 + u * uw;
      const col = u === 1 ? pal[0] : shade(pal[0], u === 0 ? -0.12 : 0.12);
      s += `<rect x="${ux}" y="${G - h}" width="${uw}" height="${h}" fill="${col}" stroke="${shade(col, -0.3)}"/>`;
      s += `<polygon points="${ux - 3},${G - h} ${ux + uw / 2},${G - h - 28} ${ux + uw + 3},${G - h}" fill="${pal[1]}"/>`;

// Procedural floor plans (balanced binary-partition layout).
(function (HH) {
  "use strict";
  HH.art = HH.art || {};

  function layout(rooms, x, y, w, h, out, depth) {
    if (rooms.length === 1) { out.push({ room: rooms[0], x, y, w, h }); return; }
    const total = rooms.reduce((a, b) => a + b.a, 0);
    let acc = 0, split = 1, best = Infinity;
    for (let i = 1; i < rooms.length; i++) {
      acc += rooms[i - 1].a;
      const d = Math.abs(acc - total / 2);
      if (d < best) { best = d; split = i; }
    }
    const A = rooms.slice(0, split), B = rooms.slice(split);
    const fa = A.reduce((a, b) => a + b.a, 0) / total;
    if (w >= h) { layout(A, x, y, w * fa, h, out, depth + 1); layout(B, x + w * fa, y, w * (1 - fa), h, out, depth + 1); }
    else { layout(A, x, y, w, h * fa, out, depth + 1); layout(B, x, y + h * fa, w, h * (1 - fa), out, depth + 1); }
  }

  const ICON = { Living: "🛋️", Kitchen: "🍳", Dining: "🍽️", Bedroom: "🛏️", "Primary Suite": "🛏️", Bath: "🛁", "Half Bath": "🚽", Office: "💻", Garage: "🚗", Laundry: "🧺", "Rec Room": "🎱", Den: "📚", "Guest Suite (ADU)": "🏡", Workshop: "🔧", Storage: "📦", Balcony: "🌿", Flex: "✨", Mudroom: "👢" };
  const FILL = { Living: "#fff4e0", Kitchen: "#e8f6ef", Dining: "#fdf0e6", Bedroom: "#e8eefc", "Primary Suite": "#dde6fb", Bath: "#e3f4f8", "Half Bath": "#e3f4f8", Office: "#f2ebfa", Garage: "#ececec", Laundry: "#eef3f3", "Rec Room": "#fbeef1", Den: "#f4efe6", "Guest Suite (ADU)": "#fff0d6", Workshop: "#efece6", Storage: "#f1f1ef", Balcony: "#e9f5e1", Flex: "#f6f6ee", Mudroom: "#f1ede6" };

  function floorsFor(L) {
    const r = HH.rng(L.art.seed ^ 0xf100);
    const F = L.f;
    const floors = [];
    const beds = L.beds, baths = L.baths;
    const fullBaths = Math.floor(baths), half = baths % 1 ? 1 : 0;
    if (L.type === "condo") {
      const rooms = [{ n: "Living", a: 3 }, { n: "Kitchen", a: 1.6 }];
      if (beds === 0) rooms[0].n = "Living";
      for (let i = 0; i < beds; i++) rooms.push({ n: i === 0 ? "Primary Suite" : "Bedroom", a: i === 0 ? 2.1 : 1.6 });
      for (let i = 0; i < fullBaths; i++) rooms.push({ n: "Bath", a: 0.8 });
      if (half) rooms.push({ n: "Half Bath", a: 0.4 });
      if (F.office) rooms.push({ n: "Den", a: 1 });
      if (F.deck) rooms.push({ n: "Balcony", a: 0.7 });
      if (F.laundry) rooms.push({ n: "Laundry", a: 0.35 });
      floors.push({ name: `Unit ${L.unit || ""}`, sqft: L.sqft, rooms });
      return floors;
    }
    const levels = Math.min(3, L.stories);
    const basementSq = L.basement === 2 ? Math.round(L.sqft * 0.25) : 0;
    const perFloor = (L.sqft - basementSq) / levels;
    const main = [{ n: "Living", a: 3 }, { n: "Kitchen", a: 1.8 }, { n: "Dining", a: 1.3 }];
    let bedsLeft = beds, fullLeft = fullBaths;
    const upper = [];
    if (levels === 1) {
      for (let i = 0; i < beds; i++) main.push({ n: i === 0 ? "Primary Suite" : "Bedroom", a: i === 0 ? 2.2 : 1.5 });

      for (let i = 0; i < Math.max(0, fullLeft); i++) upper.push({ n: "Bath", a: 0.75 });
      if (upper.length < 2) upper.push({ n: "Flex", a: 1.2 });
    }
    if (half) main.push({ n: "Half Bath", a: 0.4 });
    if (F.office) main.push({ n: "Office", a: 1.1 });
    if (F.laundry) main.push({ n: "Laundry", a: 0.45 });
    if (L.extras.indexOf("mudroom") >= 0) main.push({ n: "Mudroom", a: 0.4 });
    if (L.garage && /Attached/.test(L.garageType)) main.push({ n: "Garage", a: 1.4 * Math.min(3, L.garage) });

    if (levels > 1) {
      if (levels === 3) {
        const half2 = Math.ceil(upper.length / 2);
        floors.push({ name: "Second floor", sqft: Math.round(perFloor), rooms: upper.slice(0, half2) });
        floors.push({ name: "Third floor", sqft: Math.round(perFloor), rooms: upper.slice(half2).length ? upper.slice(half2) : [{ n: "Flex", a: 1 }] });
      } else floors.push({ name: "Upper level", sqft: Math.round(perFloor), rooms: upper });
    }
    if (L.basement === 2) floors.push({ name: "Finished basement", sqft: basementSq, rooms: [{ n: "Rec Room", a: 3 }, { n: "Storage", a: 0.8 }, r.chance(0.5) ? { n: "Bath", a: 0.6 } : { n: "Flex", a: 1 }] });
    else if (L.basement === 1) floors.push({ name: "Basement (unfinished)", sqft: 0, rooms: [{ n: "Storage", a: 3 }, { n: "Laundry", a: 0.6 }] });
    if (F.adu) floors.push({ name: "Guest suite / ADU", sqft: r.int(380, 650), rooms: [{ n: "Guest Suite (ADU)", a: 2.4 }, { n: "Bath", a: 0.7 }, { n: "Kitchen", a: 0.9 }] });
    if (F.workshop) floors.push({ name: "Workshop", sqft: r.int(200, 450), rooms: [{ n: "Workshop", a: 1 }] });
    // jitter for variety
    floors.forEach((f) => f.rooms.forEach((rm) => (rm.a *= r.range(0.85, 1.18))));
    return floors;
  }

  HH.art.floorplan = function (L) {
    const floors = floorsFor(L);
    let html = `<div class="floorplans">`;
    floors.forEach((f) => {
      const W = 360, H = f.rooms.length <= 2 ? 120 : 220;
      const rooms = f.rooms.slice().sort((a, b) => b.a - a.a);
      const out = [];

      const ftPerPx = f.sqft ? Math.sqrt(f.sqft / ((W - 8) * (H - 8))) : 0;

      out.forEach((o) => {

        svg += `<rect x="${o.x.toFixed(1)}" y="${o.y.toFixed(1)}" width="${o.w.toFixed(1)}" height="${o.h.toFixed(1)}" fill="${FILL[n] || "#f7f7f7"}" stroke="#3b3b3b" stroke-width="2"/>`;
        // door gap
        svg += `<line x1="${(o.x + o.w * 0.3).toFixed(1)}" y1="${o.y.toFixed(1)}" x2="${(o.x + o.w * 0.3 + Math.min(14, o.w * 0.3)).toFixed(1)}" y2="${o.y.toFixed(1)}" stroke="${FILL[n] || "#f7f7f7"}" stroke-width="3"/>`;
        const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
        const small = o.w < 52 || o.h < 34;
        svg += `<text x="${cx.toFixed(1)}" y="${(cy - (small ? 0 : 5)).toFixed(1)}" text-anchor="middle" font-size="${small ? 12 : 15}" dominant-baseline="middle">${ICON[n] || ""}</text>`;
        if (!small) {
          svg += `<text x="${cx.toFixed(1)}" y="${(cy + 12).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#333" font-family="Inter, Arial, sans-serif">${n}</text>`;
          if (ftPerPx) svg += `<text x="${cx.toFixed(1)}" y="${(cy + 23).toFixed(1)}" text-anchor="middle" font-size="8" fill="#777" font-family="Inter, Arial, sans-serif">${Math.round(o.w * ftPerPx)}' × ${Math.round(o.h * ftPerPx)}'</text>`;
        }
      });
      svg += `</svg>`;
      html += `<figure class="fp"><figcaption>${HH.esc(f.name)}${f.sqft ? ` · ~${HH.num(f.sqft)} sq ft` : ""}</figcaption>${svg}</figure>`;

    html += `<p class="fp-note">Floor plans are illustrative and not to scale.</p></div>`;
    return html;
  };

    const t = ctx.currentTime + 0.05;
    const chord = CHORDS[step % CHORDS.length];
    chord.forEach((f, i) => tone(f / 2, t + i * 0.015, 2.3, { type: "sine", vol: 0.05, attack: 0.08, out: musicGain }));
    tone(chord[0] / 4, t, 0.5, { type: "triangle", vol: 0.09, out: musicGain });
    tone(chord[2] / 4, t + 1.2, 0.5, { type: "triangle", vol: 0.07, out: musicGain });
    for (let i = 0; i < 4; i++) {
      if (Math.random() < 0.55) tone(MELODY[(step * 4 + i) % MELODY.length], t + i * 0.6 + 0.3, 0.45, { type: "triangle", vol: 0.035, attack: 0.02, out: musicGain });
    }
    step++;
  }
  HH.music = {
    start() {
      if (musicOn) return;
      if (!ensure()) return;
      musicOn = true;
      playBar();
      musicTimer = setInterval(playBar, 2400);
    },
    stop() { musicOn = false; clearInterval(musicTimer); },
    get on() { return musicOn; },
  };

  HH.audioSettings = settings;
  HH.setAudio = function (patch) {
    Object.assign(settings, patch);
    HH.store.set("audio", settings);
    apply();
    if (settings.music > 0 && !settings.muted) HH.music.start();
    if (settings.music <= 0) HH.music.stop();
  };
  // unlock audio on first interaction
  const unlock = () => {
    ensure();
    if (settings.music > 0 && !settings.muted) HH.music.start();
    window.removeEventListener("pointerdown", unlock);
    window.removeEventListener("keydown", unlock);
  };
  window.addEventListener("pointerdown", unlock);
  window.addEventListener("keydown", unlock);
})(window.HH);

  <script data-from="js/net.js">
// Peer-to-peer multiplayer via PeerJS (WebRTC). The host's browser is authoritative.
// Lobby codes map to PeerJS ids, so no game server is needed.
(function (HH) {
  "use strict";
  const PREFIX = "househunters-tg-v1-";
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const PING_MS = 3000, TIMEOUT_MS = 12000;

  const net = {
    role: null, // 'host' | 'client' | null (solo)
    myId: "me",
    code: null,
    peer: null,
    conns: new Map(), // host: peerId -> conn
    hostConn: null, // client: conn to host
    lastSeen: new Map(),
    handlers: [],
    leaveHandlers: [],
    closeHandlers: [],
    timer: null,
  };
  HH.net = net;

  net.available = () => typeof window.Peer === "function";
  net.makeCode = () => { let s = ""; for (let i = 0; i < 5; i++) s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)]; return s; };
  net.normalizeCode = (c) => String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/O/g, "0").replace(/I/g, "1").slice(0, 5);

  net.onMessage = (fn) => net.handlers.push(fn);
  net.onLeave = (fn) => net.leaveHandlers.push(fn);
  net.onClosed = (fn) => net.closeHandlers.push(fn);
  function dispatch(msg, from) {
    if (!msg || typeof msg !== "object" || typeof msg.t !== "string") return;
    if (msg.t === "ping") { if (net.role === "client") { net.lastSeen.set("host", Date.now()); net.send({ t: "pong" }); } return; }
    if (msg.t === "pong") { net.lastSeen.set(from, Date.now()); return; }
    if (msg.t === "bye") { if (net.role === "host") dropPeer(from); return; }
    net.handlers.forEach((fn) => { try { fn(msg, from); } catch (e) { console.error("handler error", e); } });
  }

  function friendlyError(err) {
    const t = err && err.type;
    if (t === "peer-unavailable") return "No lobby found with that code. Double-check it and make sure the host is still in the lobby.";
    if (t === "network" || t === "server-error" || t === "socket-error" || t === "socket-closed") return "Couldn't reach the matchmaking server. Check your internet connection and try again.";
    if (t === "browser-incompatible") return "Your browser doesn't support peer-to-peer connections. Try Chrome, Edge or Firefox.";
    if (t === "unavailable-id") return "That lobby code is already in use.";
    return "Connection error: " + (err && (err.message || err.type) || "unknown");
  }

  // ---------- host ----------
  net.host = function () {
    return new Promise((resolve, reject) => {
      if (!net.available()) return reject(new Error("Multiplayer library failed to load. Check your internet connection and reload the page."));
      let attempts = 0;
      const tryOpen = () => {
        attempts++;
        const code = net.makeCode();
        const peer = new window.Peer(PREFIX + code, { debug: 1 });
        let opened = false;
        const to = setTimeout(() => { if (!opened) { peer.destroy(); reject(new Error("Timed out reaching the matchmaking server. Check your connection and try again.")); } }, 15000);
        peer.on("open", () => {
          opened = true;
          clearTimeout(to);
          net.peer = peer; net.role = "host"; net.code = code; net.myId = "host";
          startHeartbeat();
          resolve(code);
        });
        peer.on("connection", (conn) => {
          conn.on("open", () => {
            net.conns.set(conn.peer, conn);
            net.lastSeen.set(conn.peer, Date.now());
          });
          conn.on("data", (d) => dispatch(d, conn.peer));
          conn.on("close", () => dropPeer(conn.peer));
          conn.on("error", () => dropPeer(conn.peer));
        });
        peer.on("disconnected", () => { if (!peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e) { /* ignore */ } }, 1500); });
        peer.on("error", (err) => {
          if (!opened) {
            clearTimeout(to);
            peer.destroy();
            if (err.type === "unavailable-id" && attempts < 6) return tryOpen();
            return reject(new Error(friendlyError(err)));
          }
          console.warn("peer error", err);
        });
      };
      tryOpen();
    });
  };

  function dropPeer(id) {
    if (!net.conns.has(id)) return;
    const c = net.conns.get(id);
    net.conns.delete(id);
    net.lastSeen.delete(id);
    try { c.close(); } catch (e) { /* ignore */ }
    net.leaveHandlers.forEach((fn) => fn(id));
  }
  net.kick = function (id, reason) {
    const c = net.conns.get(id);
    if (c) { try { c.send({ t: "kicked", reason: reason || "Removed by host" }); } catch (e) { /* ignore */ } setTimeout(() => dropPeer(id), 300); }
  };

  // ---------- client ----------
  net.join = function (rawCode) {
    return new Promise((resolve, reject) => {
      if (!net.available()) return reject(new Error("Multiplayer library failed to load. Check your internet connection and reload the page."));
      const code = net.normalizeCode(rawCode);
      if (code.length !== 5) return reject(new Error("Lobby codes are 5 characters."));
      const peer = new window.Peer({ debug: 1 });
      let done = false;
      const fail = (msg) => { if (done) return; done = true; clearTimeout(to); try { peer.destroy(); } catch (e) { /* ignore */ } reject(new Error(msg)); };
      const to = setTimeout(() => fail("Couldn't connect to that lobby (timed out). Check the code and your connection."), 16000);
      peer.on("open", () => {
        const conn = peer.connect(PREFIX + code, { reliable: true, serialization: "json" });
        conn.on("open", () => {
          if (done) return;
          done = true;
          clearTimeout(to);
          net.peer = peer; net.role = "client"; net.code = code; net.hostConn = conn; net.myId = peer.id;
          net.lastSeen.set("host", Date.now());
          startHeartbeat();
          resolve(code);
        });
        conn.on("data", (d) => dispatch(d, "host"));
        conn.on("close", () => hostLost("The host closed the lobby."));
        conn.on("error", () => hostLost("Lost connection to the host."));
      });
      peer.on("error", (err) => { if (!done) fail(friendlyError(err)); else console.warn("peer error", err); });
      peer.on("disconnected", () => { if (!peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e) { /* ignore */ } }, 1500); });
    });
  };

  function hostLost(reason) {
    if (net.role !== "client") return;
    const handlers = net.closeHandlers.slice();
    net.close(true);
    handlers.forEach((fn) => fn(reason));
  }

  // ---------- messaging ----------
  // send: client -> host (host/solo: delivered locally)
  net.send = function (msg) {
    if (net.role === "client") {
      if (net.hostConn && net.hostConn.open) { try { net.hostConn.send(msg); } catch (e) { console.warn(e); } }
    } else {
      setTimeout(() => dispatch(msg, net.myId), 0);
    }
  };
  // broadcast: host -> everyone (including itself)
  net.broadcast = function (msg, opts) {
    if (net.role === "host") {
      net.conns.forEach((c) => { if (c.open) { try { c.send(msg); } catch (e) { console.warn(e); } } });
    }
    if (!(opts && opts.skipSelf)) setTimeout(() => dispatch(msg, "host"), 0);
  };
  net.sendTo = function (id, msg) {
    if (id === net.myId || id === "host" && net.role !== "client") return setTimeout(() => dispatch(msg, "host"), 0);
    const c = net.conns.get(id);
    if (c && c.open) { try { c.send(msg); } catch (e) { console.warn(e); } }
  };

  function startHeartbeat() {
    clearInterval(net.timer);
    net.timer = setInterval(() => {
      const now = Date.now();
      if (net.role === "host") {
        net.conns.forEach((c, id) => {
          if (c.open) { try { c.send({ t: "ping" }); } catch (e) { /* ignore */ } }
          if (now - (net.lastSeen.get(id) || now) > TIMEOUT_MS) dropPeer(id);
        });
      } else if (net.role === "client") {
        if (now - (net.lastSeen.get("host") || now) > TIMEOUT_MS) hostLost("Lost connection to the host.");
      }
    }, PING_MS);
  }

  net.close = function (silent) {
    clearInterval(net.timer);
    if (net.role === "host" && !silent) net.conns.forEach((c) => { try { c.send({ t: "end", reason: "The host closed the lobby." }); } catch (e) { /* ignore */ } });
    if (net.role === "client" && net.hostConn && net.hostConn.open) { try { net.hostConn.send({ t: "bye" }); } catch (e) { /* ignore */ } }
    const peer = net.peer;
    const conns = Array.from(net.conns.values());
    if (net.hostConn) conns.push(net.hostConn);
    net.conns.clear();
    setTimeout(() => {
      conns.forEach((c) => { try { c.close(); } catch (e) { /* ignore */ } });
      try { if (peer) peer.destroy(); } catch (e) { /* ignore */ }
    }, 250);
    net.role = null; net.peer = null; net.hostConn = null; net.code = null; net.myId = "me";
    net.lastSeen.clear();
  };

  window.addEventListener("beforeunload", () => { if (net.role) net.close(); });
})(window.HH);

</script>

// Shared UI: screens, modals, toasts, HUD, profile, career & achievements.
(function (HH) {
  "use strict";
  const $ = HH.$, esc = HH.esc;
  const UI = (HH.ui = HH.ui || {});

  // ---------- screens ----------
  UI.current = null;
  UI.show = function (name) {
    HH.$$(".screen").forEach((s) => s.classList.toggle("active", s.id === "screen-" + name));
    UI.current = name;
    HH.emit("screen", name);
  };

  // ---------- toasts ----------
  UI.toast = function (text, kind, icon, ms) {
    const el = HH.frag(`<div class="toast ${kind || ""}">${icon ? `<span class="t-icon">${icon}</span>` : ""}<div>${text}</div></div>`);
    $("#toasts").appendChild(el);
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, ms || 3200);
  };

  // ---------- modals ----------
  UI.modal = function (opts) {
    const back = HH.frag(`<div class="modal-back"><div class="modal ${opts.size || ""}" role="dialog" aria-modal="true">
      <div class="modal-head"><h2>${opts.title || ""}</h2>${opts.noClose ? "" : `<button class="modal-x" data-close aria-label="Close">✕</button>`}</div>
      <div class="modal-body">${opts.body || ""}</div>
      ${opts.foot ? `<div class="modal-foot">${opts.foot}</div>` : ""}
    </div></div>`);
    const close = () => { back.remove(); document.removeEventListener("keydown", onKey); if (opts.onClose) opts.onClose(); };
    const onKey = (e) => { if (e.key === "Escape" && !opts.noClose) close(); };
    document.addEventListener("keydown", onKey);
    back.addEventListener("click", (e) => {
      if ((e.target === back && !opts.noClose && !opts.sticky) || e.target.closest("[data-close]")) { HH.sfx("click"); close(); }
    });
    $("#modal-root").appendChild(back);
    const m = { el: back, body: back.querySelector(".modal-body"), close };
    if (opts.onOpen) opts.onOpen(m);
    const first = back.querySelector("input, .btn-primary");
    if (first && opts.autofocus !== false) setTimeout(() => first.focus(), 50);
    return m;
  };
  UI.confirm = function (title, text, okLabel, onOk, danger) {
    const m = UI.modal({
      title, body: `<p>${text}</p>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-ok>${okLabel}</button>`,
    });
    m.el.querySelector("[data-ok]").addEventListener("click", () => { m.close(); onOk(); });
    return m;
  };
  UI.closeModals = () => HH.$$("#modal-root .modal-back").forEach((m) => m.remove());

  // ---------- profile ----------
  UI.COLORS = ["#e85d3f", "#2a9d8f", "#3b6fd8", "#7b5cd6", "#f4b63f", "#d6457a", "#2f9e5b", "#1d2b4f"];
  const AGENT_NAMES = ["Agent Ace", "Casey Keys", "Robin Realty", "Sam Sold", "Jamie Deeds", "Alex Escrow", "Taylor Turnkey", "Morgan Mortgage"];
  UI.profile = HH.store.get("profile", null) || { name: AGENT_NAMES[Math.floor(Math.random() * AGENT_NAMES.length)], color: UI.COLORS[Math.floor(Math.random() * UI.COLORS.length)] };
  UI.saveProfile = () => HH.store.set("profile", UI.profile);
  if (!HH.store.get("profile", null)) UI.saveProfile();
  UI.prefs = HH.store.get("prefs", { textSpeed: 1, reducedMotion: false, seenHelp: false });
  UI.savePrefs = () => { HH.store.set("prefs", UI.prefs); document.body.classList.toggle("reduced-motion", !!UI.prefs.reducedMotion); };
  document.body.classList.toggle("reduced-motion", !!UI.prefs.reducedMotion);

  UI.avatar = (p) => HH.art.agentAvatar(p.color, p.name);
  UI.cleanName = (n) => String(n || "").replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, 18) || "Agent";

  // ---------- career & achievements ----------
  const CAREER0 = { earnings: 0, deals: 0, rounds: 0, starsSum: 0, starsN: 0, cities: {}, biggest: 0, streak: 0, bestStreak: 0, ach: {}, games: 0, wins: 0 };
  UI.career = Object.assign({}, CAREER0, HH.store.get("career", {}));
  UI.saveCareer = () => HH.store.set("career", UI.career);
  UI.RANKS = [

    { id: "five", icon: "⭐", name: "Dream Home", desc: "Earn a 5-star review." },
    { id: "million", icon: "💎", name: "Seven Figures", desc: "Sell a $1,000,000+ home." },

      <div class="spacer"></div>
      ${opts && opts.step ? UI.hudSteps(opts.step) : ""}
      <div class="spacer"></div>
      ${opts && opts.extra ? opts.extra : ""}
      ${multi ? `<div class="hud-players">${players.map((p) => `<div class="hud-player ${G.status[p.id] === "done" ? "done" : ""}" style="--c:${p.color}" title="${esc(p.name)}${G.status[p.id] === "done" ? " (ready)" : ""}">${UI.avatar(p)}</div>`).join("")}</div>` : ""}
      ${multi ? `<button class="btn btn-sm btn-navy icon-btn" data-chat>💬 Chat${G.unread ? `<span class="unread-dot">${G.unread}</span>` : ""}</button>` : ""}
      ${r && r.durationMs && !(opts && opts.noTimer) ? `<div class="timer" data-timer>--:--</div>` : ""}
      <button class="btn btn-sm btn-ghost" style="color:#fff" data-menu title="Menu">☰</button>
    </div>`;
  };
  // the three phases of every round, so players always know where they are
  const STEPS = [["meet", "Meet the client"], ["search", "Pick up to 3 homes"], ["show", "Showing day"]];
  UI.hudSteps = function (cur) {
    const i = STEPS.findIndex((s) => s[0] === cur);
    const picks = HH.game ? HH.game.picks.length : 0;
