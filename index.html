      <div class="opt"><label class="field">Music</label><input type="range" min="0" max="1" step="0.05" value="${s.music}" data-aud="music" style="width:100%"></div>
      <label class="row small"><input type="checkbox" data-aud-mute ${s.muted ? "checked" : ""}> Mute everything</label>`;
  };
  UI.bindAudioControls = function (root) {
    HH.$$("[data-aud]", root).forEach((inp) => inp.addEventListener("input", () => HH.setAudio({ [inp.dataset.aud]: parseFloat(inp.value) })));
    const mute = root.querySelector("[data-aud-mute]");
    if (mute) mute.addEventListener("change", () => { HH.setAudio({ muted: mute.checked }); UI.refreshSoundToggle(); });
  };
  UI.refreshSoundToggle = function () {
    const b = $("#sound-toggle");
    if (b) b.textContent = HH.audioSettings.muted ? "🔇" : "🔊";
  };

  // ---------- chat ----------
  UI.chatLog = [];
  UI.addChat = function (m) {
    UI.chatLog.push(m);
    if (UI.chatLog.length > 200) UI.chatLog.shift();
    HH.$$(".chat-log").forEach((log) => { log.insertAdjacentHTML("beforeend", UI.chatLine(m)); log.scrollTop = log.scrollHeight; });
    const open = $(".drawer") || (UI.current === "lobby");
    if (!open && !m.sys && m.from !== HH.net.myId) { HH.game.unread++; UI.refreshHudPlayers(); HH.sfx("pop"); }
  };
  UI.chatLine = (m) => m.sys ? `<div class="chat-msg sys">${esc(m.text)}</div>` : `<div class="chat-msg" style="--c:${esc(m.color || "#1d2b4f")}"><b>${esc(m.name)}:</b> ${esc(m.text)}</div>`;
  UI.chatBox = () => `<div class="chat"><div class="chat-log">${UI.chatLog.map(UI.chatLine).join("")}</div>
    <form class="chat-form" data-chat-form><input class="input" maxlength="200" placeholder="Say something…" autocomplete="off"><button class="btn btn-sm btn-navy">Send</button></form></div>`;
  UI.bindChat = function (root) {
    HH.$$("[data-chat-form]", root).forEach((f) => f.addEventListener("submit", (e) => {
      e.preventDefault();
      const inp = f.querySelector("input");
      const text = inp.value.trim();
      if (!text) return;
      HH.net.send({ t: "chat", text: text.slice(0, 200) });
      inp.value = "";
    }));
    HH.$$(".chat-log", root).forEach((l) => (l.scrollTop = l.scrollHeight));
  };
  UI.toggleChat = function (root) {
    const ex = $(".drawer");
    if (ex) { ex.remove(); return; }
    HH.game.unread = 0;
    UI.refreshHudPlayers();
    const d = HH.frag(`<div class="drawer"><h4>💬 Lobby chat <button class="btn btn-xs btn-ghost" style="margin-left:auto" data-x>✕</button></h4>${UI.chatBox()}</div>`);
    (HH.$(".screen.active") || document.body).appendChild(d);
    d.querySelector("[data-x]").addEventListener("click", () => d.remove());
    UI.bindChat(d);
    const inp = d.querySelector("input");
    if (inp) inp.focus();
  };

  // ---------- confetti ----------
  UI.confetti = function () {
    if (UI.prefs.reducedMotion) return;
    const c = HH.frag(`<div class="confetti"></div>`);
    const colors = ["#e85d3f", "#f4b63f", "#2a9d8f", "#3b6fd8", "#7b5cd6", "#2f9e5b"];
    for (let i = 0; i < 120; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = 2.2 + Math.random() * 2.2 + "s";
      p.style.animationDelay = Math.random() * 0.8 + "s";
      p.style.transform = `rotate(${Math.random() * 360}deg)`;
      c.appendChild(p);
    }
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  };

  UI.starsHtml = (n) => `<span class="stars">${[1, 2, 3, 4, 5].map((i) => `<span class="${i <= n ? "on" : ""}">★</span>`).join("")}</span>`;
  UI.countUp = function (el, to, ms) {
    const start = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - start) / ms);
      el.textContent = HH.money(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  UI.scoreClass = (s) => (s >= 75 ? "g" : s >= 55 ? "m" : "b");

  // ---------- coach marks (first-time guided tips) ----------
  // UI.coach(id, selector, html, opts) shows a speech bubble pointing at an element, once per id.
  // Tips queue up and show one at a time. Players can turn them off; Settings can bring them back.
  if (UI.prefs.tips === undefined) UI.prefs.tips = true;
  if (!UI.prefs.coach) UI.prefs.coach = {};
  const coachQ = [];
  let coachCur = null, coachLoop = null;
  UI.coach = function (id, sel, html, opts) {
    opts = opts || {};
    if (!UI.prefs.tips || UI.prefs.coach[id]) return;
    if ((coachCur && coachCur.id === id) || coachQ.some((c) => c.id === id)) return;
    coachQ.push({ id, sel, html, opts, screen: UI.current });
    if (!coachCur) setTimeout(nextCoach, opts.delay || 350);
  };
  UI.coach.done = function (id) {
    if (!UI.prefs.coach[id]) { UI.prefs.coach[id] = 1; UI.savePrefs(); }
    const qi = coachQ.findIndex((c) => c.id === id);
    if (qi >= 0) coachQ.splice(qi, 1);
    if (coachCur && coachCur.id === id) closeCoach(true);
  };
  UI.coach.clear = function () { coachQ.length = 0; closeCoach(false); };
  UI.coach.reset = function () { UI.prefs.coach = {}; UI.prefs.tips = true; UI.savePrefs(); };
  function closeCoach(advance) {
    if (coachCur) { coachCur.el.remove(); coachCur.ring.remove(); }
    coachCur = null;
    clearInterval(coachLoop);
    if (advance && coachQ.length) setTimeout(nextCoach, 250);
  }
  function nextCoach() {
    if (coachCur || !coachQ.length || !UI.prefs.tips) return;
    const c = coachQ.shift();
    if (UI.prefs.coach[c.id] || (c.screen && c.screen !== UI.current)) return nextCoach();
    const last = !coachQ.length;
    const el = HH.frag(`<div class="coach" role="dialog" aria-live="polite"><div class="coach-arrow"></div>
      <div class="coach-text">${c.html}</div>
      <div class="coach-foot"><button class="coach-off" data-off>Turn off tips</button><span class="spacer"></span><button class="btn btn-sm btn-primary" data-ok>${c.opts.button || (last ? "Got it" : "Next ▸")}</button></div></div>`);
    const ring = HH.frag(`<div class="coach-ring"></div>`);
    document.body.appendChild(ring);
    document.body.appendChild(el);
    coachCur = { id: c.id, el, ring, sel: c.sel, screen: c.screen };
    el.querySelector("[data-ok]").addEventListener("click", () => { HH.sfx("click"); UI.coach.done(c.id); });
    el.querySelector("[data-off]").addEventListener("click", () => { UI.prefs.tips = false; UI.savePrefs(); UI.coach.clear(); UI.toast("Tips are off. You can turn them back on in Settings.", "", "💡"); });
    const place = () => {
      if (!coachCur) return;
      if (coachCur.screen && coachCur.screen !== UI.current) { UI.coach.clear(); return; }
      const t = typeof coachCur.sel === "string" ? HH.$(coachCur.sel) : null;
      const r = t && t.getBoundingClientRect();
      const present = r && r.width > 0 && r.height > 0;
      const visible = present && !HH.$(".modal-back");
      el.style.visibility = ring.style.visibility = visible ? "visible" : "hidden";
      // if the thing a tip points at goes away (e.g. the dialogue moved on), skip it for now; it can show again later
      if (!present) { coachCur.missing = coachCur.missing || Date.now(); if (Date.now() - coachCur.missing > 1500) closeCoach(true); return; }
      coachCur.missing = 0;
      if (!visible) return;
      if (!coachCur.scrolled) { coachCur.scrolled = true; try { t.scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) { /* old browsers */ } return place(); }
      const pad = 6;
      Object.assign(ring.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
      const bw = el.offsetWidth, bh = el.offsetHeight, vw = innerWidth, vh = innerHeight, gap = 16;
      let side = c.opts.side;
      if (!side) side = r.bottom + gap + bh < vh ? "below" : r.top - gap - bh > 0 ? "above" : r.left - gap - bw > 0 ? "left" : "right";
      let x, y;
      const ax = c.opts.align === "end" ? r.right - bw : c.opts.align === "start" ? r.left : r.left + r.width / 2 - bw / 2;
      if (side === "below") { x = ax; y = r.bottom + gap; }
      else if (side === "above") { x = ax; y = r.top - gap - bh; }
      else if (side === "left") { x = r.left - gap - bw; y = r.top + r.height / 2 - bh / 2; }
      else { x = r.right + gap; y = r.top + r.height / 2 - bh / 2; }
      x = Math.max(10, Math.min(vw - bw - 10, x));
      y = Math.max(10, Math.min(vh - bh - 10, y));
      el.style.left = x + "px"; el.style.top = y + "px";
      el.dataset.side = side;
      const ar = el.querySelector(".coach-arrow");
      if (side === "below" || side === "above") { ar.style.left = Math.max(16, Math.min(bw - 16, r.left + r.width / 2 - x)) + "px"; ar.style.top = ""; }
      else { ar.style.top = Math.max(16, Math.min(bh - 16, r.top + r.height / 2 - y)) + "px"; ar.style.left = ""; }
    };
    place();
    coachLoop = setInterval(place, 200);
  }
  HH.on("screen", () => { if (coachCur && coachCur.screen && coachCur.screen !== UI.current) UI.coach.clear(); });

  // Street View / maps embeds (keyless Google Maps embeds)
  UI.streetViewUrl = (L) => `https://www.google.com/maps/embed?pb=!6m7!1m6!2m2!1d${L.svLat}!2d${L.svLng}!3f${L.svHeading}!4f2!5f0.9`;
  UI.mapEmbedUrl = (L, sat) => `https://maps.google.com/maps?q=${L.lat},${L.lng}&z=${sat ? 19 : 15}&t=${sat ? "k" : "m"}&output=embed`;
  UI.mapsLink = (L) => `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${L.svLat},${L.svLng}&heading=${L.svHeading}`;
})(window.HH);

</script>
  <script data-from="js/game.js">
// Game controller: lobby, rounds, submissions and scoring.
// Solo and multiplayer share one code path; in multiplayer the host is authoritative.
(function (HH) {
  "use strict";
  const net = HH.net;
  const UI = HH.ui;
  const MAX_PLAYERS = 8;
  const COMMISSION = 0.025;
  const DATA_SIG = HH.VERSION + ":" + HH_WORLD.cities.reduce((a, c) => a + c.hoods.reduce((b, h) => b + h.homes.length, 0), 0);

  const G = (HH.game = {
    mode: null, phase: "menu",
    lobby: { code: null, players: [], settings: null },
    round: null, market: null, client: null,
    revealed: {}, asked: [], questionsLeft: 0,
    picks: [], pickBy: {}, submitted: false, ready: false,
    status: {}, totals: {}, results: null, unread: 0,
    saved: new Set(), notes: "", lastCity: null,
    host: null, // host-only state
  });

  G.defaultSettings = () => Object.assign({ gameMode: "versus", diff: "normal", city: "random", rounds: 3, timer: 8 }, HH.store.get("lastSettings", {}));
  G.myId = () => (G.mode === "solo" ? "me" : net.myId);
  G.isHost = () => G.mode === "host" || G.mode === "solo";
  G.me = () => G.lobby.players.find((p) => p.id === G.myId()) || { id: G.myId(), name: UI.profile.name, color: UI.profile.color };
  G.player = (id) => G.lobby.players.find((p) => p.id === id);
  G.isCoop = () => G.round && G.round.gameMode === "coop";

  // ---------- entry points ----------
  G.startSolo = function (settings) {
    G.reset();
    G.mode = "solo";
    net.myId = "me";
    G.lobby = { code: null, players: [{ id: "me", name: UI.profile.name, color: UI.profile.color, host: true }], settings: Object.assign({}, settings, { gameMode: "versus" }) };
    G.totals = {};
    UI.career.games++; UI.saveCareer();
    G.hostStartRound(1);
  };

  G.hostLobby = async function () {
    G.reset();
    const code = await net.host();
    G.mode = "host";
    G.lobby = { code, players: [{ id: "host", name: UI.profile.name, color: UI.profile.color, host: true }], settings: G.defaultSettings() };
    G.phase = "lobby";
    UI.chatLog = [{ sys: true, text: `Lobby ${code} created. Share the code with your friends!` }];
    UI.lobby.render();
  };

  G.joinLobby = async function (code) {
    G.reset();
    await net.join(code);
    G.mode = "client";
    G.phase = "joining";
    UI.chatLog = [];
    net.send({ t: "hello", name: UI.profile.name, color: UI.profile.color, ver: DATA_SIG });
    return new Promise((resolve, reject) => {
      G._joinWait = { resolve, reject };
      setTimeout(() => { if (G._joinWait) { G._joinWait = null; net.close(true); G.mode = null; reject(new Error("The host didn't respond. Try again.")); } }, 10000);
    });
  };

  G.reset = function () {
    G.phase = "menu"; G.round = null; G.market = null; G.client = null; G.results = null;
    G.revealed = {}; G.asked = []; G.picks = []; G.pickBy = {}; G.submitted = false; G.ready = false;
    G.status = {}; G.unread = 0; G.saved = new Set(); G.notes = ""; G.host = null; G.totals = {};
  };

  G.quitToMenu = function (reason) {
    if (net.role) net.close();
    G.mode = null;
    G.reset();
    UI.closeModals();
    const d = HH.$(".drawer"); if (d) d.remove();
    UI.menu.renderTitle();
    UI.show("title");
    if (reason) UI.modal({ title: "Back at the office", body: `<p>${HH.esc(reason)}</p>`, foot: `<button class="btn btn-primary" data-close>OK</button>` });
  };

  // ---------- host: lobby management ----------
  function broadcastLobby() { net.broadcast({ t: "lobby", lobby: G.lobby }); }
  G.updateSettings = function (patch) {
    if (!G.isHost()) return;
    Object.assign(G.lobby.settings, patch);
    HH.store.set("lastSettings", G.lobby.settings);
    broadcastLobby();
  };
  function sysChat(text) { net.broadcast({ t: "chat", sys: true, text }); }

  function uniqueName(name, id) {
    let n = name, i = 2;
    while (G.lobby.players.some((p) => p.id !== id && p.name.toLowerCase() === n.toLowerCase())) n = `${name} (${i++})`;
    return n;
  }
  function freeColor(color) {
    const used = new Set(G.lobby.players.map((p) => p.color));
    if (!used.has(color)) return color;
    return UI.COLORS.find((c) => !used.has(c)) || color;
  }

  // ---------- host: rounds ----------
  G.hostStartRound = function (num) {
    const s = G.lobby.settings;
    let cityId = s.city;
    let seed = HH.randomSeed();
    if (s.daily) {
      // Daily Client: the same city, market and client for everyone on this date
      seed = HH.hash("hh-daily-" + s.daily);
      cityId = HH_WORLD.cities[seed % HH_WORLD.cities.length].id;
    } else if (cityId === "random") {
      const ids = HH_WORLD.cities.map((c) => c.id).filter((id) => id !== G.lastCity);
      cityId = ids[Math.floor(Math.random() * ids.length)];
    }
    G.lastCity = cityId;
    const now = new Date();
    const today = s.daily ? Date.UTC(+s.daily.slice(0, 4), +s.daily.slice(5, 7) - 1, +s.daily.slice(8, 10)) : Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const market = HH.generateMarket(cityId, seed, today);
    const round = { num, total: s.rounds, seed, cityId, diff: s.diff, gameMode: G.mode === "solo" ? "versus" : s.gameMode, durationMs: (s.timer || 0) * 60000, today, checksum: market.checksum, daily: s.daily || null };
    G.host = { subs: {}, coopReady: {}, team: [], shared: {}, sharedUsed: 0, open: true, startAt: Date.now(), deadline: round.durationMs ? Date.now() + round.durationMs : 0, players: G.lobby.players.map((p) => p.id) };
    G.lobby.players.forEach((p) => { if (!G.totals[p.id]) G.totals[p.id] = { earnings: 0, deals: 0, starsSum: 0, rounds: 0, best: 0 }; });
    net.broadcast({ t: "start", round, players: G.lobby.players, totals: G.totals });
  };

  function hostCheckAllIn() {
    const H = G.host;
    if (!H || !H.open) return;
    const ids = G.lobby.players.map((p) => p.id);
    if (G.round.gameMode === "coop") {
      if (ids.every((id) => H.coopReady[id]) && H.team.length) hostReveal();
    } else if (ids.every((id) => H.subs[id])) hostReveal();
  }

  function hostReveal() {
    const H = G.host;
    if (!H || !H.open) return;
    H.open = false;
    const subs = H.subs;
    const team = H.team.slice();
    const res = computeResults(subs, team);
    // update totals (authoritative)
    G.lobby.players.forEach((p) => {
      const t = G.totals[p.id] || (G.totals[p.id] = { earnings: 0, deals: 0, starsSum: 0, rounds: 0, best: 0 });
      const pr = res.perPlayer[p.id];
      if (!pr) return;
      t.rounds++;
      t.earnings += pr.earnings;
      if (pr.won) t.deals++;
      t.starsSum += pr.stars;
      t.best = Math.max(t.best, pr.bestScore);
    });
    net.broadcast({ t: "reveal", subs, team, totals: G.totals });
  }

  G.tick = function () {
    // host deadline enforcement (2.5s grace for auto-submits)
    if (G.isHost() && G.host && G.host.open && G.host.deadline && Date.now() > G.host.deadline + 2500) hostReveal();
    // local auto-submit at deadline
    if (G.round && G.round.durationMs && (G.phase === "meeting" || G.phase === "search") && Date.now() >= G.round.deadline) {
      if (G.isCoop()) { if (!G.ready) { G.setReady(true, true); UI.toast("Time's up! Presenting the team's picks.", "", "⏰"); } }
      else if (!G.submitted) { G.submit(true); UI.toast(G.picks.length ? "Time's up! Your picks were submitted." : "Time's up! You didn't pick any homes.", G.picks.length ? "" : "bad", "⏰"); }
    }
  };

  // ---------- results (deterministic on every peer) ----------
  function computeResults(subs, team) {
    const c = G.client, m = G.market, coop = G.round.gameMode === "coop";
    const entries = [];
    if (coop) team.forEach((p, i) => { if (m.byId[p.id]) entries.push({ pid: "team", by: p.by, id: p.id, at: 0, order: i }); });
    else Object.keys(subs).sort().forEach((pid) => (subs[pid].picks || []).forEach((id, i) => { if (m.byId[id]) entries.push({ pid, id, at: subs[pid].at, order: i }); }));
    entries.forEach((e) => { e.L = m.byId[e.id]; e.ev = HH.evaluate(c, e.L); });
    let best = null;
    entries.forEach((e) => {
      if (!e.ev.ok) return;
      if (!best || e.ev.score > best.ev.score || (e.ev.score === best.ev.score && (e.at < best.at || (e.at === best.at && e.order < best.order)))) best = e;
    });
    // best on the whole market
    let mBest = null;
    m.listings.forEach((L) => { const ev = HH.evaluate(c, L); if (ev.ok && (!mBest || ev.score > mBest.ev.score)) mBest = { L, ev }; });
    const perPlayer = {};
    const dur = G.round.durationMs;
    G.lobby.players.forEach((p) => {
      const mine = coop ? entries : entries.filter((e) => e.pid === p.id);
      const bestScore = mine.reduce((a, e) => Math.max(a, e.ev.ok ? e.ev.score : Math.min(e.ev.score, 44)), 0);
      const won = !!best && (coop || best.pid === p.id);
      let commission = 0, speed = 0, review = 0;
      if (won) {
        commission = Math.round(best.L.price * COMMISSION);
        const at = coop ? (subs.__coopAt != null ? subs.__coopAt : dur) : best.at;
        if (dur) speed = Math.round(commission * 0.1 * HH.clamp(1 - at / dur, 0, 1));
        if (HH.stars(best.ev.score, true) === 5) review = 1000;
      }
      const myBestEntry = mine.filter((e) => e.ev.ok).sort((a, b) => b.ev.score - a.ev.score)[0];
      // winners are graded on the sale; others on the quality of their best acceptable pick
      const stars = won ? HH.stars(best.ev.score, true) : myBestEntry ? Math.max(1, HH.stars(myBestEntry.ev.score, true) - 1) : HH.stars(bestScore, false);
      perPlayer[p.id] = { won, commission, speed, review, earnings: commission + speed + review, bestScore, stars, picks: mine, submittedAt: coop ? 0 : subs[p.id] ? subs[p.id].at : null, myBestEntry };
    });
    return { entries, best, marketBest: mBest, perPlayer, coop };
  }
  G.computeResults = computeResults;

  // ---------- player actions ----------
  G.ask = function (topic) {
    if (G.revealed[topic]) return;
    if (G.isCoop()) { net.send({ t: "ask", topic }); return; }
    if (G.questionsLeft <= 0) return;
    G.questionsLeft--;
    G.revealed[topic] = true;
    G.asked.push(topic);
    HH.emit("revealed", { topic, by: G.myId() });
  };

  G.togglePick = function (id) {
    const L = G.market.byId[id];
    if (!L) return;
    if (G.isCoop()) {
      const has = G.picks.indexOf(id) >= 0;
      if (!has && G.picks.length >= 3) { UI.toast("The team shortlist is full (3 homes). Remove one first.", "bad", "✋"); return; }
      net.send({ t: "pick", op: has ? "remove" : "add", id });
      return;
    }
    if (G.submitted) return;
    const i = G.picks.indexOf(id);
    if (i >= 0) { G.picks.splice(i, 1); HH.sfx("remove"); }
    else {
      if (G.picks.length >= 3) { UI.toast("You can only present 3 homes. Remove one first.", "bad", "✋"); return; }
      G.picks.push(id); HH.sfx("save");
    }
    HH.emit("picks");
  };
  G.movePick = function (id, dir) {
    if (G.isCoop()) { net.send({ t: "pick", op: dir < 0 ? "up" : "down", id }); return; }
    const i = G.picks.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= G.picks.length) return;
    [G.picks[i], G.picks[j]] = [G.picks[j], G.picks[i]];
    HH.emit("picks");
  };

  G.submit = function (auto) {
    if (G.submitted || G.isCoop()) return;
    G.submitted = true;
    G.phase = "waiting";
    net.send({ t: "submit", picks: G.picks.slice(0, 3) });
    HH.emit("submitted", { auto });
  };
  G.setReady = function (ready, auto) {
    G.ready = ready;
    if (ready) G.phase = "waiting";
    else G.phase = "search";
    net.send({ t: "coopReady", ready });
    HH.emit("submitted", { auto, ready });
  };

  // ---------- message handling ----------
  net.onMessage(function (msg, from) {
    const host = G.isHost();
    switch (msg.t) {
      // ===== host-side requests =====
      case "hello": {
        if (G.mode !== "host") return;
        if (from === "host") return;
        if (msg.ver !== DATA_SIG) return net.sendTo(from, { t: "reject", reason: "Your game version doesn't match the host's. Make sure everyone has the same copy of the game." });
        if (G.phase !== "lobby") return net.sendTo(from, { t: "reject", reason: "That game has already started. Ask the host to return to the lobby." });
        if (G.lobby.players.length >= MAX_PLAYERS) return net.sendTo(from, { t: "reject", reason: "That lobby is full (8 agents max)." });
        if (G.player(from)) return;
        const p = { id: from, name: uniqueName(UI.cleanName(msg.name), from), color: freeColor(/^#[0-9a-f]{6}$/i.test(msg.color) ? msg.color : UI.COLORS[0]) };
        G.lobby.players.push(p);
        net.sendTo(from, { t: "welcome", you: from, lobby: G.lobby, chat: UI.chatLog.slice(-30) });
        broadcastLobby();
        sysChat(`${p.name} joined the lobby.`);
        HH.sfx("join");
        return;
      }
      case "chat": {
        if (host && !msg.sys && msg.from === undefined) {
          const p = G.player(from);
          if (!p) return;
          const text = String(msg.text || "").slice(0, 200);
          if (!text.trim()) return;
          net.broadcast({ t: "chat", from, name: p.name, color: p.color, text });
          return;
        }
        UI.addChat(msg);
        return;
      }
      case "ask": {
        if (!host || !G.host || !G.isCoop()) return;
        const H = G.host;
        if (H.shared[msg.topic] || H.sharedUsed >= G.client.questions || !HH.TOPICS.some((t) => t.key === msg.topic)) return;
        H.shared[msg.topic] = true;
        H.sharedUsed++;
        net.broadcast({ t: "revealed", topic: msg.topic, by: from, left: G.client.questions - H.sharedUsed });
        return;
      }
      case "pick": {
        if (!host || !G.host || !G.host.open || !G.isCoop()) return;
        const H = G.host, T = H.team;
        const i = T.findIndex((p) => p.id === msg.id);
        if (msg.op === "add" && i < 0 && T.length < 3 && G.market.byId[msg.id]) T.push({ id: msg.id, by: from });
        else if (msg.op === "remove" && i >= 0) T.splice(i, 1);
        else if ((msg.op === "up" || msg.op === "down") && i >= 0) { const j = i + (msg.op === "up" ? -1 : 1); if (j >= 0 && j < T.length) [T[i], T[j]] = [T[j], T[i]]; }
        else return;
        // changing the list un-readies everyone
        Object.keys(H.coopReady).forEach((k) => (H.coopReady[k] = false));
        net.broadcast({ t: "team", team: T, status: {} });
        return;
      }
      case "submit": {
        if (!host || !G.host || !G.host.open || G.isCoop()) return;
        if (G.host.subs[from] || !G.player(from)) return;
        const picks = Array.isArray(msg.picks) ? msg.picks.filter((id, i, a) => typeof id === "string" && G.market.byId[id] && a.indexOf(id) === i).slice(0, 3) : [];
        G.host.subs[from] = { picks, at: Date.now() - G.host.startAt };
        net.broadcast({ t: "status", id: from, state: "done" });
        hostCheckAllIn();
        return;
      }
      case "coopReady": {
        if (!host || !G.host || !G.host.open || !G.isCoop()) return;
        G.host.coopReady[from] = !!msg.ready;
        if (msg.ready && G.lobby.players.every((p) => G.host.coopReady[p.id])) G.host.subs.__coopAt = Date.now() - G.host.startAt;
        net.broadcast({ t: "status", id: from, state: msg.ready ? "done" : "" });
        hostCheckAllIn();
        return;
      }

      // ===== from host to everyone =====
      case "welcome": {
        G.lobby = msg.lobby;
        G.phase = "lobby";
        UI.chatLog = (msg.chat || []).slice();
        if (G._joinWait) { G._joinWait.resolve(); G._joinWait = null; }
        UI.lobby.render();
        return;
      }
      case "reject": {
        if (G._joinWait) { G._joinWait.reject(new Error(msg.reason)); G._joinWait = null; }
        net.close(true);
        G.mode = null;
        return;
      }
      case "lobby": {
        G.lobby = msg.lobby;
        if (G.phase === "lobby") UI.lobby.render();
        else UI.refreshHudPlayers();
        return;
      }
      case "start": {
        startRoundLocal(msg);
        return;
      }
      case "revealed": {
        if (!G.client) return;
        G.revealed[msg.topic] = true;
        if (G.asked.indexOf(msg.topic) < 0) G.asked.push(msg.topic);
        G.questionsLeft = msg.left;
        HH.emit("revealed", { topic: msg.topic, by: msg.by });
        return;
      }
      case "team": {
        G.picks = msg.team.map((p) => p.id);
        G.pickBy = {};
        msg.team.forEach((p) => (G.pickBy[p.id] = p.by));
        if (G.ready) { G.ready = false; if (G.phase === "waiting") G.phase = "search"; HH.emit("submitted", { ready: false, reset: true }); }
        G.lobby.players.forEach((p) => { if (G.status[p.id] === "done") G.status[p.id] = ""; });
        UI.refreshHudPlayers();
        HH.emit("picks");
        return;
      }
      case "status": {
        G.status[msg.id] = msg.state;
        UI.refreshHudPlayers();
        HH.emit("status");
        return;
      }
      case "reveal": {
        if (!G.client) return;
        G.totals = msg.totals || G.totals;
        if (G.isCoop()) { G.picks = msg.team.map((p) => p.id); G.pickBy = {}; msg.team.forEach((p) => (G.pickBy[p.id] = p.by)); }
        G.results = computeResults(msg.subs || {}, msg.team || []);
        G.phase = "showing";
        UI.closeModals();
        const d = HH.$(".drawer"); if (d) d.remove();
        UI.showing.start();
        return;
      }
      case "final": {
        G.phase = "final";
        G.totals = msg.totals || G.totals;
        UI.closeModals();
        UI.results.renderFinal();
        return;
      }
      case "toLobby": {
        G.phase = "lobby";
        G.round = null; G.market = null; G.client = null; G.results = null; G.totals = {};
        UI.closeModals();
        UI.lobby.render();
        return;
      }
      case "end": case "kicked": {
        if (G.mode === "client") G.quitToMenu(msg.reason || "The game ended.");
        return;
      }
    }
  });

  net.onLeave(function (id) {
    if (G.mode !== "host") return;
    const p = G.player(id);
    if (!p) return;
    G.lobby.players = G.lobby.players.filter((x) => x.id !== id);
    if (G.host) { delete G.host.subs[id]; delete G.host.coopReady[id]; }
    broadcastLobby();
    sysChat(`${p.name} left the game.`);
    HH.sfx("leave");
    hostCheckAllIn();
  });
  net.onClosed(function (reason) {
    if (G.mode === "client") G.quitToMenu(reason);
  });

  function startRoundLocal(msg) {
    const r = msg.round;
    G.lobby.players = msg.players || G.lobby.players;
    G.totals = msg.totals || G.totals;
    G.round = Object.assign({}, r, { deadline: r.durationMs ? Date.now() + r.durationMs : 0 });
    try {
      G.market = HH.generateMarket(r.cityId, r.seed, r.today);
      G.client = HH.generateClient(G.market, r.seed, r.diff);
    } catch (e) {
      console.error(e);
      UI.toast("Something went wrong generating the round.", "bad", "⚠️");
      return;
    }
    if (r.checksum && G.market.checksum !== r.checksum) UI.toast("Heads up: your listings don't match the host's. Make sure everyone has the same version of the game.", "bad", "⚠️", 7000);
    G.revealed = {}; G.asked = []; G.questionsLeft = G.client.questions;
    G.picks = []; G.pickBy = {}; G.submitted = false; G.ready = false;
    G.status = {}; G.results = null; G.saved = new Set(); G.notes = "";
    G.phase = "meeting";
    UI.closeModals();
    const d = HH.$(".drawer"); if (d) d.remove();
    UI.meeting.start();
  }

  // ---------- host navigation after results ----------
  G.nextRound = function () {
    if (!G.isHost()) return;
    if (G.round.num >= G.round.total) { net.broadcast({ t: "final", totals: G.totals }); return; }
    G.hostStartRound(G.round.num + 1);
  };
  G.backToLobby = function () {
    if (G.mode !== "host") return;
    G.host = null;
    net.broadcast({ t: "toLobby" });
  };
  G.kick = function (id) {
    if (G.mode !== "host" || id === "host") return;
    net.kick(id, "The host removed you from the lobby.");
  };
  G.startGame = function () {
    if (G.mode !== "host") return;
    G.totals = {};
    sysChat("The game is starting. Good luck, agents!");
    G.hostStartRound(1);
  };
})(window.HH);

</script>

  };

  // short, visual first-run welcome (the full rules live in "How to play")
  UI.welcome = function () {
    const m = UI.modal({
      title: "👋 Welcome to House Hunters!", size: "wide",

          <div class="ws"><div class="wn">3</div><div class="wi">⭐</div><b>Pick 3</b><span>Choose up to three homes you think they'll love, best one first.</span></div>
          <div class="ws"><div class="wn">4</div><div class="wi">🔑</div><b>Close</b><span>Tour the homes together. If they buy one, you earn the commission!</span></div>

      foot: `<button class="btn btn-ghost" data-close>I'll look around first</button><button class="btn btn-primary btn-lg" data-first>Meet my first client ▸</button>`,
    });
    m.el.querySelector("[data-first]").addEventListener("click", () => {

      HH.sfx("doorbell");
      G().startSolo({ diff: "easy", city: "random", rounds: 1, timer: 0 });

  function buildStreet() {
    const track = $("#title-track");
    if (!track) return;
    const ids = HH_WORLD.cities.map((c) => c.id);
    const cityId = ids[Math.floor(Math.random() * ids.length)];
    const m = HH.generateMarket(cityId, HH.randomSeed());
    const picks = HH.rng(HH.randomSeed()).shuffle(m.listings.filter((l) => l.type === "house")).slice(0, 7);
    const one = picks.map((L) => HH.art.house(L, { noSky: true })).join("");

  // ---------- daily client ----------
  UI.menu.daily = function () {
    const day = HH.dateKey();
    const done = HH.store.get("daily", {})[day];
    const streak = UI.dailyStreak ? UI.dailyStreak() : 0;
    const m = UI.modal({
      title: "📅 Daily Client",
      body: `<p style="margin-top:0">Every day there's one new client, and <b>everyone gets the same one</b>: same city, same homes, same secrets. Normal difficulty with a 10-minute timer.</p>
        ${done ? `<div class="first-note">✅ You already played today: ${done.won ? "sold" : "no sale"}, ${done.stars}★, ${HH.money(done.earned)}. Replays are just practice; your first result is the one that counts.</div>`
          : `<p class="muted small">Your first attempt is your official result. Afterwards, copy it and challenge your friends!</p>`}
        ${streak ? `<p class="small" style="margin-bottom:0">🔥 Streak: <b>${HH.plural(streak, "day")}</b> in a row</p>` : ""}`,
      foot: `<button class="btn btn-ghost" data-close>Not now</button><button class="btn btn-primary btn-lg" data-go>${done ? "Practice again ▸" : "Meet today's client ▸"}</button>`,

    m.el.querySelector("[data-go]").addEventListener("click", () => {

  // ---------- solo ----------
  UI.menu.soloSetup = function () {
    const newbie = UI.career.rounds < 2 && !HH.store.get("soloSettings", null);

      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary btn-lg" data-go>Start ▸</button>`,

  };

  function segOpt(label, key, opts, val) {
    return `<div class="opt"><label class="field">${label}</label><div class="seg" data-seg="${key}">${opts.map(([v, t]) => `<button type="button" data-v="${v}" class="${String(v) === String(val) ? "on" : ""}">${t}</button>`).join("")}</div></div>`;
  }
  function bindSegs(root, state, onChange) {
    HH.$$("[data-seg]", root).forEach((seg) => {
      seg.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-v]");

  }

  // ---------- host / join ----------
  UI.menu.host = function () {
    if (!HH.net.available()) return UI.modal({ title: "Multiplayer unavailable", body: `<p>The multiplayer library couldn't load. Check your internet connection and reload the page.</p>`, foot: `<button class="btn btn-primary" data-close>OK</button>` });

    G().hostLobby().then(() => { m.close(); HH.sfx("join"); }).catch((e) => {
      m.close();
      UI.modal({ title: "Couldn't create a lobby", body: `<p>${esc(e.message)}</p>`, foot: `<button class="btn btn-primary" data-close>OK</button>` });

  UI.menu.join = function (prefill) {
    if (!HH.net.available()) return UI.modal({ title: "Multiplayer unavailable", body: `<p>The multiplayer library couldn't load. Check your internet connection and reload the page.</p>`, foot: `<button class="btn btn-primary" data-close>OK</button>` });
    const m = UI.modal({
      title: "🔗 Join a lobby",
      body: `<p class="muted">Ask the host for their 5-character lobby code.</p>
        <input class="input" data-code maxlength="6" placeholder="ABCDE" value="${esc(prefill || "")}" style="font-family:var(--display);font-size:34px;letter-spacing:.3em;text-align:center;text-transform:uppercase;font-weight:700">
        <p class="small muted" style="margin-top:10px">Joining as <b>${esc(UI.profile.name)}</b>. You can change your name on the title screen.</p>
        <p class="small" data-err style="color:var(--red);font-weight:600;min-height:20px"></p>`,
      foot: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-go>Join ▸</button>`,
    });
    const inp = m.el.querySelector("[data-code]");
    const go = m.el.querySelector("[data-go]");
    const err = m.el.querySelector("[data-err]");
    inp.addEventListener("input", () => { inp.value = HH.net.normalizeCode(inp.value); });
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
    go.addEventListener("click", () => {

  UI.help = function (first) {

  // ==========================================================================

  UI.lobby = {};
  const MODE_DESC = {
    versus: "Everyone gets the same client and races to find the best homes. The client buys from whoever brings the best match (earliest submission wins ties).",

  };
  UI.lobby.render = function () {
    const g = G();
    const el = $("#screen-lobby");

    if (UI.current !== "lobby" || !el.querySelector(".lobby-wrap")) {
      el.innerHTML = `<div class="lobby-wrap">
        <div class="lobby-head"><h2>🏢 Lobby</h2>
          <div class="code-box"><div><small>Lobby code</small><div class="code">${esc(g.lobby.code || HH.net.code || "")}</div></div><button class="btn btn-sm" data-copy>📋 Copy</button>${/^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ? `<button class="btn btn-sm" data-copy-link>🔗 Invite link</button>` : ""}</div>
          <div class="spacer"></div><button class="btn btn-sm" data-help>📖 How to play</button><button class="btn btn-sm btn-danger" data-leave>${host ? "Close lobby" : "Leave"}</button></div>

        else UI.toast(esc(url), "", "🔗", 8000);

      el.querySelector("[data-help]").addEventListener("click", () => UI.help());
      el.querySelector("[data-leave]").addEventListener("click", () => UI.confirm(host ? "Close the lobby?" : "Leave the lobby?", host ? "Everyone in the lobby will be disconnected." : "You can rejoin with the same code while the lobby is open.", host ? "Close lobby" : "Leave", () => g.quitToMenu(), true));
    }
    // players
    const ps = g.lobby.players;
    el.querySelector("[data-count]").textContent = `(${ps.length}/8)`;
    const me = g.myId();
    el.querySelector("[data-players]").innerHTML = ps.map((p) => `<div class="player-row"><div class="pav" style="--c:${p.color}">${UI.avatar(p)}</div><span class="pname">${esc(p.name)}</span>${p.host ? `<span class="badge">Host</span>` : ""}${p.id === me ? `<span class="badge you">You</span>` : ""}<span class="spacer"></span>${host && !p.host ? `<button class="btn btn-xs btn-ghost" data-kick="${esc(p.id)}" title="Remove">✕</button>` : ""}</div>`).join("") +
      (ps.length < 2 ? `<div class="player-row empty">Waiting for friends… share the code <b style="margin-left:4px">${esc(g.lobby.code || "")}</b></div>` : "");
    HH.$$("[data-kick]", el).forEach((b) => b.addEventListener("click", () => g.kick(b.dataset.kick)));
    // settings
    const s = g.lobby.settings;
    const sEl = el.querySelector("[data-settings]");
    sEl.innerHTML = `${segOpt("Mode", "gameMode", [["versus", "🥊 Rival Agents"], ["coop", "🤝 Team Brokerage"]], s.gameMode)}
      <div class="muted small" style="margin-top:-6px">${MODE_DESC[s.gameMode]}</div>
      ${segOpt("Difficulty", "diff", [["easy", "Easy"], ["normal", "Normal"], ["hard", "Hard"]], s.diff)}
      <div class="opt"><label class="field">City</label><select class="select" data-k="city" ${host ? "" : "disabled"}>${cityOptions(s.city)}</select></div>
      ${segOpt("Rounds", "rounds", [[1, "1"], [3, "3"], [5, "5"], [8, "8"]], s.rounds)}
      ${segOpt("Timer per round", "timer", [[0, "Off"], [5, "5 min"], [8, "8 min"], [10, "10 min"], [15, "15 min"]], s.timer)}`;
    if (host) {
      const st = Object.assign({}, s);
      bindSegs(sEl, st, (k, v) => g.updateSettings({ [k]: v }));
      sEl.querySelector("[data-k=city]").addEventListener("change", (e) => g.updateSettings({ city: e.target.value }));
    } else HH.$$("[data-seg]", sEl).forEach((x) => { x.classList.add("disabled"); x.style.opacity = ".75"; });
    // actions
    el.querySelector("[data-actions]").innerHTML = host
      ? `<span class="note">${ps.length < 2 ? "You can start alone to test things out, but it's more fun with friends!" : `${ps.length} agents ready to hunt.`}</span><button class="btn btn-primary btn-lg" data-start>Start game ▸</button>`
      : `<span class="note">⏳ Waiting for the host to start the game…</span>`;
    const startBtn = el.querySelector("[data-start]");
    if (startBtn) startBtn.addEventListener("click", () => { HH.sfx("doorbell"); g.startGame(); });
  };
})(window.HH);

</script>
  <script data-from="js/ui/meeting.js">
// The client meeting: office scene, dialogue, questions, and the client brief.
(function (HH) {
  "use strict";
  const UI = HH.ui, esc = HH.esc, $ = HH.$;
  const G = () => HH.game;

  // ---------- client brief (shared with the computer screen) ----------
  const ICONS = { fenced: "🐕", pool: "🏊", noPool: "🚫🏊", office: "💻", garage2: "🚗", garage: "🚗", singleStory: "♿", primaryMain: "🛏️", adu: "🏡", basement: "🪜", workshop: "🔧", solar: "☀️", ev: "🔌", fireplace: "🔥", noCarpet: "🤧", kitchen: "🍳", view: "🏞️", waterfront: "🌊", nearWater: "🌊", walkable: "🚶", nearPark: "🌳", transit: "🚇", quiet: "🤫", notBusy: "🚦", noHOA: "📜", noFlood: "🌧️", moveIn: "✨", project: "🔨", dogOK: "🐶", petsOK: "🐱", quickClose: "📅", rentalOK: "🔑", garden: "🌻", rv: "🚤", hotTub: "♨️", deck: "🪑", porch: "🏡", golf: "⛳", gym: "🏋️", ac: "❄️", smallLot: "🌱", newerHome: "🆕", hardwoodNice: "🪵", schools: "🎓", lot: "🌾", hoaMax: "📜", older: "🏛️", monthly: "🧾", sqft: "📐", baths: "🛁", studio: "🎸", solarOrEv: "🔋" };
  const iconFor = (q) => ICONS[q.key] || (q.key.indexOf("extra-") === 0 ? "🔎" : "•");

  function known(q) { return !q.hidden || G().revealed[q.topic]; }

  UI.briefHtml = function (opts) {
    opts = opts || {};
    const g = G(), c = g.client, city = g.market.city;
    if (!c) return "";
    const hoodName = (id) => city.hoods.find((h) => h.id === id).name;
    const hh = [];
    if (c.kids.length) hh.push(HH.plural(c.kids.length, "kid"));
    c.pets.forEach((p) => hh.push(`${p.type} (${p.name})`));
    if (c.elder && g.revealed.household) hh.push("grandma");
    const line = (icon, html, cls) => `<div class="bline ${cls || ""}"><span class="bi">${icon}</span><span class="bt">${html}</span></div>`;
    let s = `<div class="brief"><h4>📋 ${esc(c.name)}</h4>`;
    s += line("👤", `<b>${esc(c.archTitle)}</b>${hh.length ? " · " + esc(hh.join(", ")) : ""}`);
    s += line("💰", `Budget up to <b>${HH.money(c.budget.max)}</b>${c.budget.stretch && g.revealed.budget ? ` <span class="learned">could stretch to ${HH.money(c.budget.stretch)}</span>` : ""}`);
    if (c.hoods) s += line("📍", `Only in <b>${esc(HH.listJoin(c.hoods.map(hoodName), "or"))}</b>`);
    else if (c.commute && (!c.commute.hidden || g.revealed.work)) s += line("🚗", `Commute to <b>${esc(city.work[c.commute.idx].name)}</b> ≤ <b>${c.commute.max} min</b>${c.commute.hidden ? ` <span class="learned">learned</span>` : ""}`);
    else s += line("📍", `Anywhere in ${esc(city.name)}`);
    const types = c.types.length === 3 ? "any type" : c.types.map((t) => ({ house: "house", townhome: "townhome", condo: "condo" }[t])).join(" or ");
    s += line("🛏️", `<b>${c.minBeds === 0 ? "Studio+" : c.minBeds + "+ beds"}</b> · <b>${HH.baths(c.minBaths)}+ baths</b> · ${types}`);
    const groups = [["must", "Must-haves"], ["deal", "Dealbreakers (must NOT have)"], ["nice", "Nice-to-haves"]];
    groups.forEach(([kind, title]) => {
      const list = c.reqs.filter((q) => q.kind === kind && known(q));
      if (!list.length) return;
      s += `<div class="bsec">${title}</div>`;
      list.forEach((q) => { s += line(iconFor(q), `<b>${esc(q.label)}</b>${q.hidden ? ` <span class="learned">learned</span>` : ""}`, kind); });
    });
    const hiddenLeft = c.reqs.filter((q) => !known(q)).length + (c.commute && c.commute.hidden && !g.revealed.work ? 1 : 0);
    if (c.diff !== "easy") {
      s += `<div class="unknown">${hiddenLeft ? "🤔 They might want more than they've said. Questions can uncover it." : (g.asked.length ? "✅ You've uncovered everything they're hiding!" : "🤔 They might want more than they've said.")}</div>`;
    }
    if (opts.notes !== false) s += `<textarea data-notes placeholder="Your notes…">${esc(g.notes)}</textarea>`;
    if (opts.apply && c.diff === "easy") s += `<button class="btn btn-sm btn-teal btn-block" style="margin-top:8px" data-apply-brief>⚡ Apply brief to filters</button>`;
    s += `</div>`;
    return s;
  };
  UI.bindBrief = function (root) {
    HH.$$("[data-notes]", root).forEach((t) => t.addEventListener("input", () => { G().notes = t.value; HH.$$("[data-notes]").forEach((o) => { if (o !== t) o.value = t.value; }); }));
  };

  // ---------- dialogue engine ----------
  const D = { lines: [], i: 0, text: "", shown: 0, timer: null, onDone: null, typing: false };
  const SPEED = [38, 20, 9, 0];
  function speakerName() { const c = G().client; return c.people.length === 2 ? `${c.people[0].name} & ${c.people[1].name}` : c.people[0].name; }

  function say(lines, onDone) {
    D.lines = lines.slice(); D.i = 0; D.onDone = onDone;
    nextLine();
  }
  function nextLine() {
    clearInterval(D.timer);
    const box = $("#dlg-text");
    if (!box) return;
    if (D.i >= D.lines.length) { D.typing = false; setTalking(false); const f = D.onDone; D.onDone = null; if (f) f(); return; }
    D.text = D.lines[D.i++];
    D.shown = 0;
    D.typing = true;
    D.isHint = isHint(D.text);
    addLog(D.text, "client", D.isHint ? "hint" : "");
    setTalking(true);
    const sp = SPEED[UI.prefs.textSpeed == null ? 1 : UI.prefs.textSpeed];
    $("#dlg-prog").textContent = `${D.i}/${D.lines.length}`;
    if (!sp) { finishLine(); return; }
    let n = 0;
    D.timer = setInterval(() => {
      D.shown = Math.min(D.text.length, D.shown + 1);
      box.innerHTML = esc(D.text.slice(0, D.shown)) + `<span class="caret"></span>`;
      if (++n % 3 === 0) HH.sfx("blip");
      if (D.shown >= D.text.length) finishLine();
    }, sp);
  }
  function finishLine() {
    clearInterval(D.timer);
    D.typing = false;
    setTalking(false);
    const box = $("#dlg-text");
    if (box) box.innerHTML = esc(D.text) + (D.isHint ? `<span class="hint-tag" title="Hints point to something they haven't told you yet">💡 Hint</span>` : "");
    const hint = $("#dlg-next");
    if (hint) hint.classList.remove("hidden");
    if (D.isHint) UI.coach("meet-hint", "#dlg-text .hint-tag", "That was a <b>hint</b>! Your client is hiding something. Later, ask the question that matches it to find out what they really want.", { delay: 150 });
  }
  function isHint(t) { const c = G().client; return !!(c && c.hintLines && c.hintLines.indexOf(t) >= 0); }
  function advance() {
    if (G().phase !== "meeting") return;
    if (!D.started) { beginOpening(); return; }
    if (D.typing) { finishLine(); return; }
    if (D.onDone || D.i < D.lines.length) { $("#dlg-next").classList.add("hidden"); nextLine(); }
  }
  function setTalking(on) { const s = $(".clients-seat"); if (s) s.classList.toggle("talking", on); }
  function addLog(text, who, extra) {
    const log = $("#talk-log");
    if (!log) return;
    log.insertAdjacentHTML("beforeend", `<div class="talk-line ${who === "me" ? "me" : ""} ${extra || ""}">${who === "me" ? "" : `<b>${esc(speakerName())}:</b> `}${esc(text)}</div>`);
    const body = log.closest(".side-body");
    if (body) body.scrollTop = body.scrollHeight;
  }

  // ---------- office scene ----------
  function skyline(cityId) {
    const r = HH.rng(HH.hash(cityId));
    let s = `<svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMax slice">`;
    let x = 0;
    while (x < 300) {
      const w = r.int(18, 38), h = r.int(30, 105);
      s += `<rect x="${x}" y="${120 - h}" width="${w}" height="${h}" fill="${r.pick(["#7d93ad", "#8aa0b8", "#6f86a3", "#9ab0c6"])}"/>`;
      for (let wy = 120 - h + 6; wy < 116; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7) if (r.chance(0.5)) s += `<rect x="${wx}" y="${wy}" width="3" height="4" fill="#dce9f5" opacity=".8"/>`;
      if (r.chance(0.12)) s += `<rect x="${x + w / 2 - 1}" y="${120 - h - 14}" width="2" height="14" fill="#6f86a3"/>`;
      x += w + r.int(0, 4);
    }
    return s + `</svg>`;
  }

  function clientsHtml(mood) {
    const c = G().client;
    let s = "";
    c.people.forEach((p) => { s += HH.art.person(p.av, { mood: mood || "happy", size: 172 }); });
    c.kids.slice(0, 3).forEach((k, i) => { s += `<span class="kid" title="${esc(k)}">${["🧒", "👧", "👦"][i % 3]}</span>`; });
    if (c.elder && G().revealed.household) s += `<span class="kid" title="${esc(c.elder)}">👵</span>`;
    c.pets.forEach((p) => { s += `<span class="pet" title="${esc(p.name)}">${p.type === "dog" ? "🐕" : "🐈"}</span>`; });
    return s;
  }
  UI.clientsHtml = clientsHtml;

  UI.meeting = {};
  UI.meeting.stop = function () { clearInterval(D.timer); clearTimeout(D.startTimer); D.onDone = null; D.typing = false; D.lines = []; D.i = 0; };
  // the opening starts after the client walks in; Skip/Space can start it early
  function beginOpening() {
    if (D.started) return;
    D.started = true;
    clearTimeout(D.startTimer);

      if (hadHidden) setTimeout(() => HH.sfx("pop"), 200);

      // a teammate asked: log it quietly without interrupting this player's dialogue
      addLog(`${byName} asked: "${t.q}"`, "me");
      answers.forEach((a) => addLog(a, "client", "reveal"));
      const panel = $("#ask-panel");
      if (panel && !panel.classList.contains("hidden")) showQuestions();
      UI.toast(`${esc(byName)} asked: <i>${esc(t.q)}</i>`, "", t.icon, 3500);
    } else {
      if (!mine) UI.toast(`${esc(byName)} asked the client: <i>${esc(t.q)}</i><br>${esc(answers.join(" "))}`, "", t.icon, 6000);
    }
    renderBrief();
    // achievement: uncovered everything
    const c = g.client;
    const allKnown = c.reqs.every((q) => !q.hidden || g.revealed[q.topic]) && !(c.commute && c.commute.hidden && !g.revealed.work);
    const hadAny = c.reqs.some((q) => q.hidden) || (c.commute && c.commute.hidden);
    if (allKnown && hadAny && c.diff !== "easy") UI.unlock("mind");
  });
})(window.HH);

    ["gym", "Gym (home or building)", (L) => !!L.f.gym || L.extras.indexOf("gym") >= 0], ["elevator", "Elevator building", (L) => !!L.f.elevator],

    if (f.yearMin && L.yearBuilt < f.yearMin) return false;
    if (f.yearMax && L.yearBuilt > f.yearMax) return false;

    HH.$$("[data-saved-n]").forEach((x) => (x.textContent = `(${n})`));
    const b = $("[data-saved]");
    if (b) b.classList.toggle("on", F.savedOnly);
  }

  // ---------- history ----------
  function push(entry) { hist = hist.slice(0, histI + 1); hist.push(entry); histI = hist.length - 1; updateNavBtns(); }
  function go(d) {
    const j = histI + d;
    if (j < 0 || j >= hist.length) return;
    histI = j;
    const e = hist[j];
    if (e.type === "detail") openDetail(e.id, true); else closeDetail(true);
    updateNavBtns();
  }
  function updateNavBtns() {
    const b = $("[data-back]"), f = $("[data-fwd]");
    if (b) b.disabled = histI <= 0;
    if (f) f.disabled = histI >= hist.length - 1;
  }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function updateUrl() {
    const u = $("[data-url]");
    if (!u) return;
    const city = G().market.city;
    if (detailId) { const L = G().market.byId[detailId]; u.innerHTML = `<span class="lock">🔒</span>roofline.house/<b>${slug(city.name)}-${city.state.toLowerCase()}/${slug(L.hoodName)}/${slug(L.address)}</b>`; }
    else {
      const parts = [];
      if (F.q) parts.push("q=" + encodeURIComponent(F.q));
      if (F.priceMax) parts.push("max=" + F.priceMax);
      if (F.beds) parts.push("beds=" + F.beds);
      if (F.hoods.length) parts.push("hoods=" + F.hoods.join(","));
      if (F.feats.length) parts.push("has=" + F.feats.join(","));
      u.innerHTML = `<span class="lock">🔒</span>roofline.house/<b>${slug(city.name)}-${city.state.toLowerCase()}/${F.savedOnly ? "saved" : "for-sale"}</b>${parts.length ? "?" + esc(parts.join("&")) : ""}`;
    }
    updateNavBtns();
  }

  // ---------- filters ----------
  function opts(values, sel, fmt, anyLabel) {
    return `<option value="0">${anyLabel || "Any"}</option>` + values.map((v) => `<option value="${v}" ${Number(sel) === v ? "selected" : ""}>${fmt(v)}</option>`).join("");
  }
  const PRICES = (() => { const a = []; for (let p = 100000; p <= 1000000; p += 50000) a.push(p); for (let p = 1100000; p <= 2000000; p += 100000) a.push(p); for (let p = 2250000; p <= 5000000; p += 250000) a.push(p); return a; })();

    const g = G(), m = g.market, city = m.city;
    const el = $("[data-filters]");

    const pills = (key, vals, fmt) => `<div class="pills" data-pills="${key}">${vals.map((v) => `<button type="button" data-v="${v}" class="${F[key] === v ? "on" : ""}">${fmt(v)}</button>`).join("")}</div>`;
    const cur = results();
    el.innerHTML = `
      <h5>Neighborhoods <button class="btn btn-xs btn-ghost reset" data-reset>Reset all filters</button></h5>
      <div class="checks">${city.hoods.map((h) => `<label class="ck"><input type="checkbox" data-hood="${h.id}" ${F.hoods.indexOf(h.id) >= 0 ? "checked" : ""}>${esc(h.name)} <span class="muted small">${"$".repeat(h.ppsf >= 600 ? 4 : h.ppsf >= 420 ? 3 : h.ppsf >= 260 ? 2 : 1)}</span><span class="cnt">${hoodBase.filter((L) => L.hoodId === h.id).length}</span></label>`).join("")}</div>
      <h5>Price</h5>
      <div class="frow"><select class="select" data-num="priceMin">${opts(PRICES, F.priceMin, HH.moneyShort, "No min")}</select><span>–</span><select class="select" data-num="priceMax">${opts(PRICES, F.priceMax, HH.moneyShort, "No max")}</select></div>
      <h5>Bedrooms</h5>${pills("beds", [0, 1, 2, 3, 4, 5], (v) => (v ? v + "+" : "Any"))}
      <h5>Bathrooms</h5>${pills("baths", [0, 1, 1.5, 2, 2.5, 3], (v) => (v ? v + "+" : "Any"))}
      <h5>Home type</h5>
      <div class="checks">${[["house", "Single-family house"], ["townhome", "Townhome"], ["condo", "Condo"]].map(([k, t]) => `<label class="ck"><input type="checkbox" data-type="${k}" ${F.types.indexOf(k) >= 0 ? "checked" : ""}>${t}<span class="cnt">${typeBase.filter((L) => L.type === k).length}</span></label>`).join("")}</div>
      <h5>Commute (rush hour)</h5>
      <select class="select" data-commute-idx style="margin-bottom:6px"><option value="-1">Choose a destination…</option>${city.work.map((w, i) => `<option value="${i}" ${F.commuteIdx === i ? "selected" : ""}>${esc(w.name)}</option>`).join("")}</select>
      <select class="select" data-num="commuteMax" ${F.commuteIdx < 0 ? "disabled" : ""}>${opts([10, 15, 20, 25, 30, 35, 40, 45, 50, 60], F.commuteMax, (v) => `≤ ${v} min`, "Any time")}</select>
      <h5>Square feet</h5>
      <div class="frow"><select class="select" data-num="sqftMin">${opts([500, 750, 1000, 1250, 1500, 1750, 2000, 2500, 3000, 3500, 4000, 5000], F.sqftMin, HH.num, "No min")}</select><span>–</span><select class="select" data-num="sqftMax">${opts([750, 1000, 1250, 1500, 1750, 2000, 2500, 3000, 3500, 4000, 5000, 7500], F.sqftMax, HH.num, "No max")}</select></div>
      <h5>Monthly cost (est.)</h5>
      <select class="select" data-num="monthlyMax">${opts([1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 6000, 7000, 8000, 10000, 12500, 15000, 20000], F.monthlyMax, (v) => "≤ " + HH.money(v) + "/mo", "Any")}</select>
      <h5>HOA fee</h5>
      <select class="select" data-hoa><option value="-1">Any</option>${[[0, "No HOA"], [50, "≤ $50/mo"], [100, "≤ $100/mo"], [200, "≤ $200/mo"], [300, "≤ $300/mo"], [500, "≤ $500/mo"]].map(([v, t]) => `<option value="${v}" ${F.hoaMax === v ? "selected" : ""}>${t}</option>`).join("")}</select>
      <h5>Garage spaces</h5>${pills("garage", [0, 1, 2, 3], (v) => (v ? v + "+" : "Any"))}
      <h5>Lot size</h5>
      <select class="select" data-num="lotMin">${opts([0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.75, 1], F.lotMin, (v) => `≥ ${v} acres`, "Any")}</select>
      <h5>Year built</h5>
      <div class="frow"><input class="input" type="number" data-yr="yearMin" placeholder="Min" min="1800" max="2026" value="${F.yearMin || ""}"><span>–</span><input class="input" type="number" data-yr="yearMax" placeholder="Max" min="1800" max="2026" value="${F.yearMax || ""}"></div>
      <h5>Condition</h5>
      <select class="select" data-num="condMin"><option value="0">Any condition</option><option value="2" ${F.condMin === 2 ? "selected" : ""}>Good or better</option><option value="3" ${F.condMin === 3 ? "selected" : ""}>Move-in ready only</option></select>
      <h5>Schools &amp; walkability</h5>
      <div class="frow"><select class="select" data-num="schoolMin">${opts([5, 6, 7, 8, 9], F.schoolMin, (v) => `Schools ${v}+`, "Any school")}</select><select class="select" data-num="walkMin">${opts([50, 70, 90], F.walkMin, (v) => `Walk ${v}+`, "Any walk")}</select></div>
      <h5>Must have</h5>
      <div class="checks">${FEATS.map(([k, t]) => { const n = cur.filter(FEAT[k][2]).length; const on = F.feats.indexOf(k) >= 0; return `<label class="ck"><input type="checkbox" data-feat="${k}" ${on ? "checked" : ""}>${t}<span class="cnt">${on ? "" : n}</span></label>`; }).join("")}</div>
      <h5>Hide homes with</h5>
      <div class="checks">${EXCL.map(([k, t]) => `<label class="ck"><input type="checkbox" data-excl="${k}" ${F.excl.indexOf(k) >= 0 ? "checked" : ""}>${t}</label>`).join("")}</div>`;
    const changed = () => { page = 0; renderResults(); renderFilters(); };
    HH.$$("[data-hood]", el).forEach((c) => c.addEventListener("change", () => { toggleIn(F.hoods, c.dataset.hood, c.checked); changed(); }));
    HH.$$("[data-type]", el).forEach((c) => c.addEventListener("change", () => { toggleIn(F.types, c.dataset.type, c.checked); changed(); }));
    HH.$$("[data-feat]", el).forEach((c) => c.addEventListener("change", () => { toggleIn(F.feats, c.dataset.feat, c.checked); changed(); }));
    HH.$$("[data-excl]", el).forEach((c) => c.addEventListener("change", () => { toggleIn(F.excl, c.dataset.excl, c.checked); changed(); }));
    HH.$$("[data-num]", el).forEach((s) => s.addEventListener("change", () => { F[s.dataset.num] = parseFloat(s.value) || 0; changed(); }));
    HH.$$("[data-yr]", el).forEach((s) => s.addEventListener("change", () => { const v = parseInt(s.value, 10); F[s.dataset.yr] = v >= 1800 && v <= 2030 ? v : 0; changed(); }));
    el.querySelector("[data-hoa]").addEventListener("change", (e) => { F.hoaMax = parseInt(e.target.value, 10); changed(); });
    el.querySelector("[data-commute-idx]").addEventListener("change", (e) => { F.commuteIdx = parseInt(e.target.value, 10); if (F.commuteIdx < 0) F.commuteMax = 0; else if (sort === "newest") sort = "commute"; changed(); });
    HH.$$("[data-pills]", el).forEach((p) => p.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; F[p.dataset.pills] = parseFloat(b.dataset.v); HH.sfx("click"); changed(); }));
    el.querySelector("[data-reset]").addEventListener("click", () => { F = blankFilters(); const qi = $("[data-q]"); if (qi) qi.value = ""; HH.sfx("remove"); changed(); });
  }
  function toggleIn(arr, v, on) { const i = arr.indexOf(v); if (on && i < 0) arr.push(v); if (!on && i >= 0) arr.splice(i, 1); }

  function activeChips() {
    const city = G().market.city, chips = [];
    const add = (label, clear) => chips.push({ label, clear });
    if (F.savedOnly) add("♡ Saved homes only", () => (F.savedOnly = false));
    if (F.fitsOnly && showFit()) add("✓ Fits the brief", () => (F.fitsOnly = false));
    if (F.q) add(`"${F.q}"`, () => { F.q = ""; const qi = $("[data-q]"); if (qi) qi.value = ""; });
    F.hoods.forEach((h) => add(city.hoods.find((x) => x.id === h).name, () => toggleIn(F.hoods, h, false)));
    if (F.priceMin) add("≥ " + HH.moneyShort(F.priceMin), () => (F.priceMin = 0));
    if (F.priceMax) add("≤ " + HH.moneyShort(F.priceMax), () => (F.priceMax = 0));
    if (F.beds) add(F.beds + "+ beds", () => (F.beds = 0));
    if (F.baths) add(F.baths + "+ baths", () => (F.baths = 0));
    F.types.forEach((t) => add(HH.cap(t), () => toggleIn(F.types, t, false)));
    if (F.commuteIdx >= 0 && F.commuteMax) add(`≤ ${F.commuteMax} min to ${city.work[F.commuteIdx].name}`, () => (F.commuteMax = 0));
    if (F.sqftMin) add("≥ " + HH.num(F.sqftMin) + " sqft", () => (F.sqftMin = 0));
    if (F.sqftMax) add("≤ " + HH.num(F.sqftMax) + " sqft", () => (F.sqftMax = 0));
    if (F.monthlyMax) add("≤ " + HH.money(F.monthlyMax) + "/mo", () => (F.monthlyMax = 0));
    if (F.hoaMax >= 0) add(F.hoaMax === 0 ? "No HOA" : "HOA ≤ $" + F.hoaMax, () => (F.hoaMax = -1));
    if (F.garage) add(F.garage + "+ garage", () => (F.garage = 0));
    if (F.lotMin) add("≥ " + F.lotMin + " ac", () => (F.lotMin = 0));
    if (F.yearMin) add("Built ≥ " + F.yearMin, () => (F.yearMin = 0));
    if (F.yearMax) add("Built ≤ " + F.yearMax, () => (F.yearMax = 0));
    if (F.condMin) add(F.condMin === 3 ? "Move-in ready" : "Good condition+", () => (F.condMin = 0));
    if (F.schoolMin) add("Schools " + F.schoolMin + "+", () => (F.schoolMin = 0));
    if (F.walkMin) add("Walk " + F.walkMin + "+", () => (F.walkMin = 0));
    F.feats.forEach((k) => add("✓ " + FEAT[k][1], () => toggleIn(F.feats, k, false)));
    F.excl.forEach((k) => add("✗ " + EX[k][1], () => toggleIn(F.excl, k, false)));
    return chips;
  }

  // ---------- results ----------
  function cardHtml(L) {
    const g = G();
    const picked = g.picks.indexOf(L.id) >= 0, saved = g.saved.has(L.id);
    const tags = [];
    if (L.status === "pending") tags.push(`<span class="tag tag-pending">Pending</span>`);
    if (L.badges.indexOf("new") >= 0) tags.push(`<span class="tag tag-new">New</span>`);
    if (L.badges.indexOf("pricecut") >= 0) tags.push(`<span class="tag tag-cut">Price cut</span>`);
    if (L.badges.indexOf("openhouse") >= 0) tags.push(`<span class="tag tag-open">Open house</span>`);
    if (L.badges.indexOf("newbuild") >= 0) tags.push(`<span class="tag tag-newbuild">New build</span>`);
    const ci = F.commuteIdx;
    return `<div class="card ${L.status === "pending" ? "pending" : ""} ${picked ? "picked" : ""}" data-open="${L.id}">
      <div class="ph">${S.art(L)}<div class="tags">${tags.join("")}</div>
        <button class="pick ${picked ? "on" : ""}" data-pick="${L.id}" title="${picked ? "Remove from client picks" : "Add to client picks"}">⭐</button>
        <button class="heart ${saved ? "on" : ""}" data-heart="${L.id}" title="Save">${saved ? "♥" : "♡"}</button></div>
      <div class="body">
        <div class="price">${HH.money(L.price)}${L.origPrice > L.price ? `<s>${HH.moneyShort(L.origPrice)}</s>` : ""}</div>
        <div class="facts"><b>${L.beds === 0 ? "Studio" : L.beds + "</b> bd"} · <b>${HH.baths(L.baths)}</b> ba · <b>${HH.num(L.sqft)}</b> sqft${L.lotAcres ? ` · ${L.lotAcres} ac` : ""}</div>
        <div class="addr">${esc(L.address)}, ${esc(L.hoodName)}</div>
        <div class="meta"><span>${L.typeLabel}</span><span>${L.yearBuilt}</span>${L.hoa ? `<span>HOA $${L.hoa}</span>` : ""}${ci >= 0 ? `<span>🚗 ${L.commute[ci]} min</span>` : ""}<span>≈ ${HH.money(L.monthly)}/mo</span></div>
        ${fitBadge(L)}
      </div></div>`;
  }

  function renderResults() {
    const el = $("[data-results]");
    if (!el) return;
    const g = G(), city = g.market.city;
    const list = results();
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    page = Math.min(page, pages - 1);
    const chips = activeChips();
    el.innerHTML = `<div class="results-bar"><h4>${list.length} ${list.length === 1 ? "home" : "homes"} ${F.savedOnly ? "saved" : "for sale"} in ${esc(city.name)}, ${city.state}</h4><span class="spacer"></span>
        ${showFit() ? `<label class="fits-toggle" title="Hide homes that break something you know your client needs"><input type="checkbox" data-fits ${F.fitsOnly ? "checked" : ""}> Fits the brief only</label>` : ""}
        <label class="small muted">Sort</label><select class="select" data-sort>${SORTS.map(([k, t]) => `<option value="${k}" ${sort === k ? "selected" : ""}>${t}</option>`).join("")}</select>
        <div class="seg"><button data-view="grid" class="${view === "grid" ? "on" : ""}">▦ List</button><button data-view="map" class="${view === "map" ? "on" : ""}">🗺️ Map</button></div></div>
      ${chips.length ? `<div class="active-filters">${chips.map((c, i) => `<button class="af" data-chip="${i}">${esc(c.label)} ✕</button>`).join("")}</div>` : ""}
      ${view === "grid" ? `<div class="results-scroll" data-scroll>${list.length ? `<div class="cards">${list.slice(page * PAGE, page * PAGE + PAGE).map(cardHtml).join("")}</div>
          ${pages > 1 ? `<div class="pager">${Array.from({ length: pages }, (_, i) => `<button data-page="${i}" class="${i === page ? "on" : ""}">${i + 1}</button>`).join("")}</div>` : ""}`
        : `<div class="empty-state"><div class="big">🏚️</div><b>No homes match these filters.</b><br>Try loosening a few. Your client might be flexible on something!</div>`}</div>`
        : `<div class="map-view" data-map></div>`}`;
    el.querySelector("[data-sort]").addEventListener("change", (e) => { sort = e.target.value; page = 0; renderResults(); });
    const fitsBox = el.querySelector("[data-fits]");
    if (fitsBox) fitsBox.addEventListener("change", () => { F.fitsOnly = fitsBox.checked; page = 0; HH.sfx("click"); UI.coach.done("site-toggle"); renderResults(); renderFilters(); });
    HH.$$("[data-view]", el).forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; HH.sfx("click"); renderResults(); }));
    HH.$$("[data-chip]", el).forEach((b) => b.addEventListener("click", () => { chips[+b.dataset.chip].clear(); page = 0; renderResults(); renderFilters(); }));
    HH.$$("[data-page]", el).forEach((b) => b.addEventListener("click", () => { page = +b.dataset.page; renderResults(); const sc = $("[data-scroll]"); if (sc) sc.scrollTop = 0; }));
    if (view === "map") renderMap(list);
    else if (map) { try { map.remove(); } catch (e) { /* ignore */ } map = null; }
    renderNav();
    updateUrl();
  }

  function onCardClick(e) {
    const pick = e.target.closest("[data-pick]");
    if (pick) { e.stopPropagation(); G().togglePick(pick.dataset.pick); return; }
    const heart = e.target.closest("[data-heart]");
    if (heart) { e.stopPropagation(); toggleSave(heart.dataset.heart); return; }
    const open = e.target.closest("[data-open]");
    if (open) { HH.sfx("click"); openDetail(open.dataset.open); }
  }
  function toggleSave(id) {
    const s = G().saved;
    if (s.has(id)) { s.delete(id); HH.sfx("remove"); } else { s.add(id); HH.sfx("save"); }
    HH.$$(`[data-heart="${id}"]`).forEach((b) => { b.classList.toggle("on", s.has(id)); b.innerHTML = b.classList.contains("btn") ? (s.has(id) ? "♥ Saved" : "♡ Save") : s.has(id) ? "♥" : "♡"; });
    renderNav();
    if (F.savedOnly) renderResults();
  }

  function renderMap(list) {
    const box = $("[data-map]");
    if (!box) return;
    if (!window.L || !window.L.map) { box.innerHTML = `<div class="map-fallback">🗺️ The map couldn't load (no internet connection?). The list view still works.</div>`; return; }
    if (map) { try { map.remove(); } catch (e) { /* ignore */ } map = null; }
    const Lf = window.L;
    map = Lf.map(box, { zoomControl: true, attributionControl: true });
    const osm = Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }).addTo(map);
    let tileErrors = 0;
    osm.on("tileerror", () => {
      if (++tileErrors !== 4 || !map) return;
      // fall back to Esri if OSM tiles are blocked (e.g. when opened from a local file)
      map.removeLayer(osm);
      Lf.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors" }).addTo(map);
    });
    markerLayer = Lf.layerGroup().addTo(map);
    const g = G();
    const pts = [];
    list.forEach((L) => {
      const cls = L.status === "pending" ? "pending" : g.picks.indexOf(L.id) >= 0 ? "picked" : g.saved.has(L.id) ? "saved" : "";
      const icon = Lf.divIcon({ className: "", html: `<div class="map-pin ${cls}">${HH.moneyShort(L.price)}</div>`, iconSize: [0, 0] });
      const mk = Lf.marker([L.lat, L.lng], { icon, title: L.address, riseOnHover: true }).addTo(markerLayer);
      mk.on("click", () => openDetail(L.id));
      pts.push([L.lat, L.lng]);
    });
    const city = g.market.city;
    city.work.forEach((w) => {
      const icon = Lf.divIcon({ className: "", html: `<div class="map-pin" style="background:#1d2b4f">💼 ${esc(w.name)}</div>`, iconSize: [0, 0] });
      Lf.marker([w.lat, w.lng], { icon, interactive: false }).addTo(markerLayer);
    });
    if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
    else map.setView([city.hoods[0].lat, city.hoods[0].lng], 11);
    setTimeout(() => map && map.invalidateSize(), 60);
  }

  // ---------- detail ----------
  function distText(m) { return m >= 9999 ? "over 0.5 mi" : m < 160 ? `${Math.round(m * 3.28 / 10) * 10} ft` : `${(m / 1609).toFixed(1)} mi`; }

  function openDetail(id, fromHist) {
    const g = G(), L = g.market.byId[id];
    if (!L) return;
    detailId = id;
    if (!fromHist) push({ type: "detail", id });
    const site = $(".site");
    let d = site.querySelector(".detail");
    if (d) d.remove();
    d = HH.frag(detailHtml(L));
    site.appendChild(d);
    bindDetail(d, L);
    updateUrl();
    UI.coach.done("site-open");
    UI.coach("detail-check", ".detail .brief-check", "This <b>brief check</b> compares the home with everything you know about your client.", { side: "left", delay: 450 });
    UI.coach("detail-street", ".detail [data-gtab=street]", "Take a look at the real street in <b>Google Street View</b>.", { side: "below" });
    UI.coach("detail-disc", ".detail [data-disc]", "Always read the <b>seller disclosures</b>. Foundation problems, flood zones or tenants can sink a deal.", { side: "right" });
    UI.coach("detail-pick", ".detail [data-pick-detail]", "Like it? <b>Add it to your client picks</b>. You can present up to 3 homes.", { side: "below" });
  }
  function closeDetail(fromHist) {
    const d = $(".site .detail");
    if (d) d.remove();
    if (detailId && !fromHist) push({ type: "search" });
    detailId = null;
    updateUrl();
  }
  S.openDetail = openDetail;

  function detailHtml(L) {
    const g = G(), city = g.market.city, F2 = L.f;
    const picked = g.picks.indexOf(L.id) >= 0, saved = g.saved.has(L.id);
    const hood = city.hoods.find((h) => h.id === L.hoodId);
    const yes = [], no = [];
    const feat = (on, t) => (on ? yes : no).push(t);
    feat(F2.pool, "Pool"); feat(F2.fenced, "Fenced yard"); feat(F2.office, "Home office"); feat(L.basement > 0, L.basement === 2 ? "Finished basement" : "Basement (unfinished)");

          <div class="d-section" data-disc><h3>⚠️ Seller disclosures</h3>${L.disclosures.length ? L.disclosures.map((t) => `<div class="disc ${/foundation|roof is near|electrical|water intrusion|AS-IS|galvanized|termite|HVAC system is/i.test(t) ? "bad" : ""}">${esc(t)}</div>`).join("") : `<div class="muted small">No disclosures reported.</div>`}</div>

            <div class="kv">
